<style>
  :root{
    --paper:#FBF7EE;
    --paper-2:#F3ECDD;
    --ink:#20242A;
    --ink-soft:#5A5F66;
    --seal:#B33B3B;
    --seal-dark:#8F2E2E;
    --jade:#3E7C59;
    --gold:#C08A2E;
    --line:#E4DCC8;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    /* 병음(알파벳·성조)은 라틴 전용 글꼴(Noto Sans)로, 한글은 Noto Sans KR로 표시 — 한국어 글꼴의 1성(ā ē ī ō ū) 모양이 어긋나 보이던 문제 해결 */
    font-family:'Noto Sans', 'Noto Sans KR', -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .hanzi{font-family:'Noto Serif SC', serif;}
  #app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--paper);position:relative;padding-bottom:84px;}

  header.top{
    padding:22px 20px 16px;
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px;
  }
  .seal-mark{
    width:44px;height:44px;border-radius:50%;background:var(--paper-2);
    font-size:26px;overflow:hidden;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    border:1.5px solid var(--line);
  }
  .seal-mark img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
  header.top h1{font-size:19px;margin:0;line-height:1.2;}
  header.top p{margin:2px 0 0;font-size:12px;color:var(--ink-soft);}
  .streak-badge{
    margin-left:auto;font-size:14px;font-weight:700;color:var(--seal);white-space:nowrap;
  }
  @keyframes todayPulse{
    0%{box-shadow:0 0 0 0 rgba(179,59,59,0.45);}
    70%{box-shadow:0 0 0 8px rgba(179,59,59,0);}
    100%{box-shadow:0 0 0 0 rgba(179,59,59,0);}
  }
  .today-pulse{animation:todayPulse 2s ease-out infinite;}

  }
  nav.tabs button{
    flex:1;border:none;background:none;padding:12px 4px 10px;
    font-family:inherit;font-size:11px;color:var(--ink-soft);cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;
  }
  nav.tabs button .ic{font-size:18px;}
  nav.tabs button .ic.num{
    display:inline-flex;align-items:center;justify-content:center;
    width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;
    font-size:12px;font-weight:700;
  }
  nav.tabs button.active{color:var(--seal);font-weight:700;}

  .home-subtabs{gap:6px;}
  .subtab-btn{
    flex:1;border:1px solid var(--line);background:#fff;border-radius:20px;
    padding:6px 8px;font-family:inherit;font-size:12px;color:var(--ink-soft);cursor:pointer;
  }
  .subtab-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700;}

  section.view{display:none;padding:18px 20px 20px;}
  section.view.active{display:block;}

  .card{
    background:#fff;border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;margin-bottom:14px;
  }
  .card h3{margin:0 0 4px;font-size:15px;}
  .sub{font-size:12.5px;color:var(--ink-soft);}
  .card .sub{margin-bottom:10px;}
  .row-between{display:flex;justify-content:space-between;align-items:center;}
  .badge{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:26px;height:20px;padding:0 6px;border-radius:6px;
    background:var(--paper-2);color:var(--gold);font-size:12px;font-weight:700;
  }
  .badge.due{background:#FCE9E9;color:var(--seal);}

  button.primary{
    background:var(--seal);color:#fff;border:none;border-radius:10px;
    padding:11px 16px;font-family:inherit;font-size:14px;font-weight:700;

  .review-body{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;align-items:center;gap:18px;}

  .writing-row{display:flex;gap:12px;justify-content:center;flex-wrap:nowrap;}

  canvas.wcanvas{

  }

    width:100%;max-width:360px;background:#fff;border:1px solid var(--line);

  .rate-row{display:flex;gap:8px;width:100%;max-width:360px;}

  .rate-easy{background:var(--gold);}

<script>
/* ---------------- 스마트폰 뒤로가기 버튼 대응 ----------------
   모달이나 복습 화면이 열려있을 때 뒤로가기를 누르면 앱이 종료되지 않고
   그 화면만 닫히도록, 열 때마다 히스토리를 한 칸 쌓아두고 뒤로가기(popstate)를 가로챕니다.
   suppressNextPopstate는 "닫기 버튼 등으로 우리가 직접 history.back()을 호출한 경우"를
   실제 사용자의 뒤로가기와 구분해서, 이미 처리한 닫기 동작을 중복 처리하지 않기 위한 플래그입니다. */
let overlayPushed = false;
let tabPushed = false;
let suppressNextPopstate = false;
function pushOverlayState(){
  if(!overlayPushed){
    overlayPushed = true;
    history.pushState({appOverlay:true}, '');
  }
}
function consumeOverlayState(){
  if(overlayPushed){
    overlayPushed = false;
    suppressNextPopstate = true;
    history.back();
  }
}
window.addEventListener('popstate', function(){
  if(suppressNextPopstate){
    suppressNextPopstate = false;
    return;
  }
  const modalBg = document.getElementById('modalBg');
  const reviewOverlay = document.getElementById('reviewOverlay');
  const modalWasActive = modalBg.classList.contains('active');
  const reviewWasActive = reviewOverlay.classList.contains('active');
  if(modalWasActive || reviewWasActive){
    overlayPushed = false;
    if(modalWasActive) modalBg.classList.remove('active');
    if(reviewWasActive){
      reviewOverlay.classList.remove('active');
      review = null;
      TAB_RENDER[document.querySelector('.tab-btn.active').dataset.tab]();
    }
  } else if(tabPushed){
    tabPushed = false;
    switchTab('home');
  }
});

/* ---------------- storage helpers (브라우저 localStorage 사용 — 로그인 불필요) ---------------- */
async function sGet(key){
  try{ const raw = localStorage.getItem(key); return raw===null ? null : JSON.parse(raw); }
  catch(e){ return null; }
}
async function sSet(key,val){
  try{ localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch(e){ console.error('storage set failed', e); return false; }
}

/* ---------------- date helpers ---------------- */
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function addDays(base, n){
  const d = new Date(base+'T00:00:00');
  d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function uid(prefix){
  return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._h);
  toast._h=setTimeout(()=>t.classList.remove('show'),1800);
}

/* 매주 월요일 00시가 지나면 일일 미션 완료 기록을 자동으로 초기화 (요일별 단어 구성 자체는 유지) */
function getMondayDateStr(d){
  const date = new Date(d);
  const dow = (date.getDay()+6)%7; // 0=월 ... 6=일
  date.setDate(date.getDate()-dow);
  date.setHours(0,0,0,0);
  return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');
}
async function checkWeeklyMissionReset(){
  const currentMonday = getMondayDateStr(new Date());
  const stored = await sGet('mission-week-start');
  if(stored !== currentMonday){
    await setClearedMission([]);
    await sSet('mission-week-start', currentMonday);
  }
}

/* ---------------- 일일 미션 연속 달성(스트릭) ---------------- */
function dateStrOf(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
/* isRest(요일번호 0=월~6=일): 미션이 하나도 없는 '쉬는 날'은 연속 기록을 끊지도, 늘리지도 않아요 */
function computeStreak(log, isRest){
  if(!log) return 0;
  isRest = isRest || (()=>false);
  const wd = dt=>(dt.getDay()+6)%7;
  let streak = 0;
  const d = new Date();
  if(!log[dateStrOf(d)]){ d.setDate(d.getDate()-1); }
  for(let guard=0; guard<3660; guard++){
    if(log[dateStrOf(d)]){ streak++; }
    else if(!isRest(wd(d))){ break; }
    d.setDate(d.getDate()-1);
  }
  return streak;
}

function computeQueue(deckName, cards, idFilter, clearedSet){
  let pool = cards;
  if((deckName==='hsk' || deckName==='expr') && idFilter){
    const allowed = new Set(idFilter);
    pool = cards.filter(c=>allowed.has(c.id));
  }
  return pool
    .filter(c=> !clearedSet.has(deckName+':'+c.id))
    .map(c=>({...c, _key:deckName+':'+c.id}));
}

function resolveHskScope(cards, rawScope){
  const allIds = cards.map(c=>c.id);
  if(!rawScope || !Array.isArray(rawScope)) return allIds;
  const filtered = rawScope.filter(id=>allIds.includes(id));
  return filtered.length ? filtered : allIds;
}
async function getSavedHskScope(cards){
  const saved = await sGet('hsk-review-scope');
  return resolveHskScope(cards, saved);
}

const VOCAB_MERGE_V1 = {"nǎr": "어디, 어느 곳", "duō": "많다, 얼마나(형용사 앞)", "yào": "~하려고 해/~해야 해(+동사), 원하다/필요하다(+명사)", "diǎn": "(시각) 시, 주문하다"};
function normVocabPy(py){ return String(py||'').toLowerCase().replace(/[\s()'’…,]/g,''); }
async function syncVocabV1(){
  if(await sGet('vocab-sync-v1')) return;
  let deck = await loadDeck('textbook-vocab');
  if(deck.length===0){ await sSet('vocab-sync-v1', true); return; } // 새로 설치하면 시드에 이미 다 들어 있음
  // 1) 같은 병음 단어 합치기 — 첫 카드를 남기고 나머지의 즐겨찾기·미션 배정을 옮긴 뒤 삭제
  const starred = new Set(await getStarredKeys());
  const scope = await getMissionScope('vocab');
  const removeIds = new Set();
  for(const [py, ko] of Object.entries(VOCAB_MERGE_V1)){
    const same = deck.filter(c=>normVocabPy(c.py)===normVocabPy(py));
    if(same.length===0) continue;
    const keep = same[0];
    keep.ko = ko;
    same.slice(1).forEach(c=>{
      removeIds.add(c.id);
      if(starred.has('vocab:'+c.id)){ starred.delete('vocab:'+c.id); starred.add('vocab:'+keep.id); }
      Object.keys(scope).forEach(d=>{
        const arr = scope[d]||[];
        if(arr.includes(c.id)){
          scope[d] = arr.filter(id=>id!==c.id);
          if(!scope[d].includes(keep.id)) scope[d].push(keep.id);
        }
      });
    });
  }
  deck = deck.filter(c=>!removeIds.has(c.id));
  // 2) 那 nà: 저것 → 저것, 그러면
  const na = deck.find(c=>normVocabPy(c.py)==='nà');
  if(na && na.ko==='저것') na.ko = '저것, 그러면';
  // 3) 새 단어 추가 (이미 있는 병음은 건너뜀)
  const have = new Set(deck.map(c=>normVocabPy(c.py)));
  VOCAB_ADD_V1_RAW.trim().split('\n').forEach(line=>{
    const [py, ko] = line.split('\t');
    if(have.has(normVocabPy(py))) return;
    have.add(normVocabPy(py));
    deck.push({id:uid('vocab'), py, ko});
  });
  await saveDeck('textbook-vocab', deck);
  await setStarredKeys([...starred]);
  await setMissionScope('vocab', scope);
  await sSet('vocab-sync-v1', true);
}

const EXPR_POINT_LINE = (()=>{ const m = {}; EXPR_POINT_LINE_RAW.split('\n').forEach(l=>{ const [k,py,pt] = l.split('\t'); m[k+'|'+normPy(py)] = pt; }); return m; })();
function exprPoint(card){
  if(!card || card.book==null) return '';
  const bl = Number(card.book)+'-'+Number(card.lesson);
  return EXPR_POINT_LINE[bl+'|'+normPy(card.py)] || (card.group ? EXPR_POINT_GROUP[bl+'-'+card.group] : '') || '';
}
async function syncExprSeeds(){
  const applied = (await sGet('expr-seed-versions')) || {};
  let deck = await loadDeck('textbook-expr');
  let changed = false;
  for(const sd of EXPR_SEEDS){
    const tag = sd.book+'-'+sd.lesson;
    if((applied[tag]||0) >= sd.ver) continue;
    const seedRows = sd.raw().trim().split('\n').map(line=>{
      const [ko,py,book,lesson,group] = line.split('\t');
      return {ko, py, book:Number(book), lesson:Number(lesson), group};
    });
    const isThis = c=>Number(c.book)===sd.book && Number(c.lesson)===sd.lesson;
    const existing = deck.filter(isThis);
    if(sd.onlyIfEmpty && existing.length){ applied[tag] = sd.ver; changed = true; continue; }
    const pool = {};  // 병음별 기존 카드 목록 (같은 병음이 여러 번이면 순서대로 짝지음)
    existing.forEach(c=>{ const k=normPy(c.py); (pool[k]=pool[k]||[]).push(c); });
    const used = new Set();
    const ordered = seedRows.map(r=>{
      const list = pool[normPy(r.py)];
      const hit = list && list.find(c=>!used.has(c.id));
      if(hit){ used.add(hit.id); return {...hit, book:r.book, lesson:r.lesson, group:r.group}; }
      return {id:uid('expr'), ...r};
    });
    const leftovers = existing.filter(c=>!used.has(c.id));
    const lessonCards = ordered.concat(leftovers);
    // 덱에서 이 과를 빼고, 권/과 순서에 맞는 자리에 다시 넣기
    const rest = deck.filter(c=>!isThis(c));
    const keyOf = c=>(Number(c.book)||0)*1000+(Number(c.lesson)||0);
    const myKey = sd.book*1000+sd.lesson;
    let pos = rest.findIndex(c=>c.book!=null && keyOf(c) > myKey);
    if(pos<0) pos = rest.length;
    deck = rest.slice(0,pos).concat(lessonCards, rest.slice(pos));
    applied[tag] = sd.ver;
    changed = true;
  }
  if(changed){
    await saveDeck('textbook-expr', deck);
    await sSet('expr-seed-versions', applied);
  }
}

/* 표현 미션: 그룹(권-과-그룹) 안의 순서는 교재대로, 그룹끼리만 무작위 */
function orderExprByGroup(queue, deckCards){
  const idx = {};
  deckCards.forEach((c,i)=>{ idx[c.id]=i; });
  const groups = new Map();
  queue.forEach(c=>{
    const g = (c.book??'')+'-'+(c.lesson??'')+'-'+(c.group||'');
    if(!groups.has(g)) groups.set(g, []);
    groups.get(g).push(c);
  });
  const arr = [...groups.values()].map(list=>list.sort((a,b)=>(idx[a.id]??0)-(idx[b.id]??0)));
  return shuffle(arr).flat();
}

    });

  await syncVocabV2();
}
async function syncVocabV2(){
  if(await sGet('vocab-sync-v2')) return;
  const deck = await loadDeck('textbook-vocab');

  await sSet('vocab-sync-v2', true);
}

const W1019_VOCAB_PY = ['yóulèyuán','xióngmāo','xiě xìn','mén','ménkǒur','kāi','guān','zhe','zhèng(zài)','dǎ tàijíquán','dǎ','lìhai','duì','cuò','měi','biǎoyǎn','méi wèntí','kāishǐ','zuò fàn',
  'chuántǒng','wǔshù','zǎochen','yǐqián','wèishénme',
  'dàifu','shūfu','bù shūfu','dùzi','téng','tóu téng','tòng','cóng','shénme shíhou','de','gèng','hǎixiān','tài…le','yuǎn','yīyuàn','fēnzhōng','zhīdào'];
async function m2PresetW1019(){
  if(await sGet('m2-preset-1019d')) return;
  const starredAlreadyReset = !!(await sGet('m2-preset-1019c'));
  if(todayStr() > '2026-10-21'){ await sSet('m2-preset-1019d', true); return; }
  const s = await getSettings();
  const LD = '2026-10-22';
  if(!s.nextLesson || s.nextLesson.slice(0,10)!==LD){
    const tm = (s.nextLesson && s.nextLesson.slice(11,16)) || '10:00';
    s.nextLesson = LD+'T'+tm;
    await setSettings(s);
  }
  const cycle = m2Cycle(s);
  const [hsk, vocab, expr] = await Promise.all([loadDeck('hsk-words'), loadDeck('textbook-vocab'), loadDeck('textbook-expr')]);
  const hskIds = hsk.filter(c=>{ const lv=String(c.level), n=Number(c.no); return (lv==='2' && n>=110 && n<=126) || (lv==='3' && n>=1 && n<=30); }).map(c=>c.id);
  const vset = new Set(W1019_VOCAB_PY.concat(VOCAB_ADD_V2_RAW.trim().split('\n').map(l=>l.split('\t')[0])).map(normVocabPy));
  const vocabIds = vocab.filter(c=>vset.has(normVocabPy(c.py))).map(c=>c.id);
  const exprIds = expr.filter(c=>Number(c.book)===3 && [5,6,7].includes(Number(c.lesson))).map(c=>c.id);   // 5~7과 본문·예문·문형연습·연습 전부
  const at = Date.now();
  await sSet('m2-range-hsk',   {cycle, new:hskIds,   old:[], start:{}, at});
  await sSet('m2-range-vocab', {cycle, new:vocabIds, old:[], start:{}, at});
  await sSet('m2-range-expr',  {cycle, new:exprIds,  old:[], start:{}, at});
  // 이번 주만: 반복 없이 범위를 남은 날에 균등하게 한 번씩 (헷갈리는 건 즐겨찾기로 직접 반복)
  const days = []; for(let d=todayStr(); d<=m2Eve(s); d=addDays(d,1)) days.push(d);
  const order = (cards, ids)=>{ const S=new Set(ids); return cards.filter(c=>S.has(c.id)); };
  const fixed = {cycle, decks:{
    hsk: m2EvenSchedule('hsk', order(hsk, hskIds), days),
    vocab: m2EvenSchedule('vocab', order(vocab, vocabIds), days),
    expr: m2EvenSchedule('expr', order(expr, exprIds), days),
  }};
  await sSet('m2-fixed', fixed);
  // 즐겨찾기 초기화 (한자·단어·표현 모두) — 한 번만
  if(!starredAlreadyReset){ await setStarredKeys([]); await setClearedStarred([]); }
  await sSet('m2-plan', null);
  await sSet('m2-preset-1019c', true);
  await sSet('m2-preset-1019d', true);
}
/* 카드들을 남은 날 수로 균등하게 나눠 하루에 한 묶음씩 (표현은 예문 묶음이 갈라지지 않게) */
function m2EvenSchedule(deck, cards, days){
  const D = days.length, out = Object.fromEntries(days.map(d=>[d,[]]));
  let rest = cards.slice();
  for(let i=0;i<D;i++){
    const chunk = m2TakeChunk(deck, rest, Math.ceil(rest.length/(D-i)));
    rest = rest.slice(chunk.length);
    out[days[i]] = chunk.map(c=>c.id);
  }
  return out;
}

    <label class="field-label" style="margin-top:10px;">한국어 뜻</label>
    <input type="text" id="editKo" value="${esc(card.ko)}" style="margin-bottom:10px;">

      <button class="ghost" style="flex:1;color:var(--seal);" onclick="deleteWord('${deckName}','${id}')">삭제</button>

    </div>
  `;

}
async function saveEditWord(deckName, id){
  const deckKey = deckName==='hsk' ? 'hsk-words' : (deckName==='vocab' ? 'textbook-vocab' : 'textbook-expr');
  const cards = await loadDeck(deckKey);
  const idx = cards.findIndex(c=>c.id===id);
  if(idx===-1){ closeModal(); return; }
  cards[idx].py = document.getElementById('editPy').value.trim();
  cards[idx].ko = document.getElementById('editKo').value.trim();
  if(deckName==='hsk'){
    cards[idx].han = document.getElementById('editHan').value.trim();
    cards[idx].level = document.getElementById('editLevel').value.trim();
  }
  if(deckName==='expr'){
    cards[idx].book = Number(document.getElementById('editBook').value||1);
    cards[idx].lesson = Number(document.getElementById('editLesson').value||1);
    cards[idx].group = document.getElementById('editGroup').value.trim() || null;
  }
  await saveDeck(deckKey, cards);
  closeModal();
  toast('수정되었어요');
  if(deckName==='hsk') renderHskTab(); else if(deckName==='vocab') renderVocabTab(); else renderExprTab();
}
async function deleteWord(deckName, id){
  const deckKey = deckName==='hsk' ? 'hsk-words' : (deckName==='vocab' ? 'textbook-vocab' : 'textbook-expr');
  const cards = await loadDeck(deckKey);
  await saveDeck(deckKey, cards.filter(c=>c.id!==id));
  const key = deckName+':'+id;
  const [cleared, clearedStarred, starred] = await Promise.all([getCleared(), getClearedStarred(), getStarredKeys()]);
  await setCleared(cleared.filter(k=>k!==key));
  await setClearedStarred(clearedStarred.filter(k=>k!==key));
  await setStarredKeys(starred.filter(k=>k!==key));
  closeModal();
  toast('삭제되었어요');
  if(deckName==='hsk') renderHskTab(); else if(deckName==='vocab') renderVocabTab(); else renderExprTab();
}

async function openMissionEditor(deckName){

  const [cards, scopeObj] = await Promise.all([loadDeck(deckKey), getMissionScope(deckName)]);

  const books = deckName==='expr' ? [...new Set(cards.map(c=>c.book).filter(b=>b!=null))].sort((a,b)=>a-b) : [];
  const days = await getMissionDays(deckName);

  window._missionDay = todayMissionIndex();

function computeDistPool(){
  const {deckName, cards, distRanges} = window._missionEdit;
  if(!distRanges || distRanges.length===0) return cards;
  const seen = new Set();
  const result = [];
  distRanges.forEach(r=>{
    cards.forEach(c=>{
      if(seen.has(c.id)) return;
      let match = false;
      if(deckName==='hsk'){
        match = String(c.level)===String(r.level) && Number(c.no)>=r.from && Number(c.no)<=r.to;
      } else if(deckName==='expr'){
        const key = (Number(c.book)||0)*1000 + (Number(c.lesson)||0);
        match = key>=r.from && key<=r.to;
      }
      if(match){ seen.add(c.id); result.push(c); }
    });
  });
  return result;
}

  const level = document.getElementById('distLevel').value;
  const from = Number(document.getElementById('distFrom').value);
  const to = Number(document.getElementById('distTo').value);
  if(!from || !to || from>to){ toast('번호 범위를 확인해주세요'); return; }
  window._missionEdit.distRanges.push({level, from, to, label: level+'급 '+from+'~'+to});
  renderMissionEditorModal();
}
function addDistRangeWholeLevel(){
  const level = document.getElementById('distLevel').value;
  const nos = window._missionEdit.cards.filter(c=>String(c.level)===String(level)).map(c=>Number(c.no));
  if(nos.length===0){ toast('해당 급수에 단어가 없어요'); return; }
  const from = Math.min(...nos);
  const to = Math.max(...nos);

  renderMissionEditorModal();

    </div>
  `;

function groupKeyOf(c){
  return (c.book||'')+'-'+(c.lesson||'')+'-'+(c.group||c.id);
}
function groupAwareChunks(pool, numDays){
  const groupMap = {};
  const groupsOrder = [];
  pool.forEach(c=>{
    const key = groupKeyOf(c);
    if(!groupMap[key]){ groupMap[key]=[]; groupsOrder.push(key); }
    groupMap[key].push(c);
  });
  // 큰 그룹부터 배정하되, 매번 "지금 가장 적게 채워진 요일"에 넣어서 최대한 균등하게 맞춤
  const groupsSorted = groupsOrder.slice().sort((a,b)=> groupMap[b].length - groupMap[a].length);
  const days = Array.from({length:numDays}, ()=>[]);
  groupsSorted.forEach(key=>{
    let minIdx = 0;
    for(let d=1; d<numDays; d++){
      if(days[d].length < days[minIdx].length) minIdx = d;
    }
    days[minIdx].push(...groupMap[key]);
  });
  return days;
}
function autoDistributeMission(){
  const {deckName, scope} = window._missionEdit;
  const pool = computeDistPool();
  const n = pool.length;
  if(n===0){ toast('배분할 단어가 없어요'); return; }
  const snapshot = {};
  for(let d=0; d<7; d++) snapshot[d] = new Set(scope[d]);
  window._missionEdit.prevScope = snapshot;
  const {reviewDay} = window._missionEdit;
  const days = window._missionEdit.distDays.filter(d=>d!==reviewDay).sort((a,b)=>a-b);
  if(days.length===0){ toast('배분 요일을 하나 이상 골라주세요'); return; }
  // 복습일을 뺀 나머지 요일은 모두 비우고, 고른 요일에만 나눠 담기
  for(let d=0; d<7; d++){ if(d!==reviewDay) scope[d] = new Set(); }
  const dayNames = days.map(d=>MISSION_DAYS[d]).join('·');
  if(deckName==='expr' && pool.some(c=>c.group)){
    const chunks = groupAwareChunks(pool, days.length);
    days.forEach((d,i)=>{ scope[d] = new Set(chunks[i].map(c=>c.id)); });
    toast('대화문/예문 그룹을 유지하며 '+dayNames+'에 배분했어요 (복습일은 그대로) — 저장을 눌러야 반영돼요');
  } else {
    const perDay = Math.ceil(n/days.length);
    days.forEach((d,i)=>{
      const chunk = pool.slice(i*perDay, (i+1)*perDay);
      scope[d] = new Set(chunk.map(c=>c.id));
    });
    toast(dayNames+'에 순서대로 '+days.length+'등분했어요 (복습일은 그대로) — 저장을 눌러야 반영돼요');
  }
  renderMissionEditorModal();
}
function undoAutoDistribute(){
  const {scope, reviewDay} = window._missionEdit;
  for(let d=0; d<7; d++){ if(d!==reviewDay) scope[d] = new Set(); }
  window._missionEdit.prevScope = null;
  toast('복습일을 뺀 모든 요일을 비웠어요 — 저장을 눌러야 반영돼요');

async function startDayMission(dayIndex){
  const [scopeHsk, scopeVocab, scopeExpr, clearedArr] = await Promise.all([
    getMissionScope('hsk'), getMissionScope('vocab'), getMissionScope('expr'), getClearedMission()
  ]);
  const clearedSet = new Set(clearedArr);
  function remainFor(name, scope){
    return (scope[dayIndex]||[]).filter(id=>!clearedSet.has(name+':'+id)).length;
  }
  if(remainFor('hsk', scopeHsk)>0) return startMissionReview('hsk', dayIndex);
  if(remainFor('vocab', scopeVocab)>0) return startMissionReview('vocab', dayIndex);
  if(remainFor('expr', scopeExpr)>0) return startMissionReview('expr', dayIndex);
  toast(MISSION_DAYS[dayIndex]+'요일 미션이 모두 완료됐어요!');
}
async function startMissionReview(deckName, dayIndex){
  const day = dayIndex!=null ? dayIndex : todayMissionIndex();
  const deckKey = deckName==='hsk' ? 'hsk-words' : (deckName==='vocab' ? 'textbook-vocab' : 'textbook-expr');
  const cards = await loadDeck(deckKey);
  const scopeObj = await getMissionScope(deckName);
  const dayIds = new Set(scopeObj[day]||[]);
  if(dayIds.size===0){ toast(MISSION_DAYS[day]+'요일에 지정된 미션 단어가 없어요. "미션 설정"에서 추가해보세요'); return; }
  const pool = cards.filter(c=>dayIds.has(c.id));
  const clearedMission = new Set(await getClearedMission());
  let queue = computeQueue(deckName, pool, null, clearedMission);
  if(queue.length===0){ toast(MISSION_DAYS[day]+'요일 미션 완료! "다시하기"를 누르면 다시 볼 수 있어요'); return; }
  queue = deckName==='expr' ? orderExprByGroup(queue, cards) : shuffle(queue);
  const starred = new Set(await getStarredKeys());
  review = {deck:deckName, queue, index:0, stage:'question', starred, mode:'mission'};
  document.getElementById('reviewOverlay').classList.add('active');
  pushOverlayState();
  renderReviewStep();
}

    renderScopeWordList(document.getElementById('scopeSearch').value);
  });
  document.querySelectorAll('.scope-level-check').forEach(cb=>{
    cb.addEventListener('change', ()=>{

function addScopeRange(){
  const level = document.getElementById('scopeRangeLevel').value;
  const from = Number(document.getElementById('scopeRangeFrom').value);
  const to = Number(document.getElementById('scopeRangeTo').value);
  if(!from || !to || from>to){ toast('번호 범위를 확인해주세요'); return; }
  const matched = window._scopeCards.filter(c=>String(c.level)===String(level) && Number(c.no)>=from && Number(c.no)<=to);
  if(matched.length===0){ toast('해당 범위에 단어가 없어요'); return; }
  matched.forEach(c=>window._scopeSelected.add(c.id));
  document.getElementById('scopeRangeFrom').value = '';
  document.getElementById('scopeRangeTo').value = '';
  renderScopeWordList(document.getElementById('scopeSearch').value);
  toast(level+'급 '+from+'~'+to+'번 ('+matched.length+'개) 선택했어요');
}
function scrollToScopeLevel(level){
  const el = document.querySelector('[data-level-anchor="'+level+'"]');
  if(el){ el.scrollIntoView({behavior:'smooth', block:'start'}); }
  else{ toast(level+'급 단어가 지금 목록에 안 보여요 (검색 필터를 확인해보세요)'); }

function updateScopeMeta(){
  const allBox = document.getElementById('scopeAll');
  if(allBox) allBox.checked = window._scopeSelected.size===window._scopeCards.length;
  document.querySelectorAll('.scope-level-check').forEach(cb=>{
    const lvl = cb.dataset.level;
    const idsInLevel = window._scopeCards.filter(c=>String(c.level)===lvl).map(c=>c.id);
    cb.checked = idsInLevel.length>0 && idsInLevel.every(id=>window._scopeSelected.has(id));
  });
  const countEl = document.getElementById('scopeCount');
  if(countEl) countEl.textContent = window._scopeSelected.size+' / '+window._scopeCards.length+'개 선택됨';
}
function renderScopeWordList(query){
  const wrap = document.getElementById('scopeWordList');
  let list = window._scopeCards;
  if(query) list = list.filter(c=>(c.han+c.py+c.ko+c.en).toLowerCase().includes(query.toLowerCase()));
  const seenLevels = new Set();
  wrap.innerHTML = list.length ? list.map(c=>{
    const lvl = String(c.level);
    const isFirst = !seenLevels.has(lvl);
    if(isFirst) seenLevels.add(lvl);
    return `
    <label class="hstack" style="align-items:center;padding:5px 0;border-bottom:1px solid #F0EBDD;" ${isFirst?`data-level-anchor="${esc(lvl)}"`:''}>

      <span class="hanzi" style="font-size:16px;min-width:44px;">${esc(c.han)}</span>
      <span style="font-size:12.5px;color:var(--ink-soft);">${esc(c.py)} · ${esc(c.ko)}</span>

  `;}).join('') : '<div class="empty">해당하는 단어가 없어요.</div>';

    cb.addEventListener('change', ()=>{
      if(cb.checked) window._scopeSelected.add(cb.dataset.id); else window._scopeSelected.delete(cb.dataset.id);

async function confirmScopeAndStart(){

/* ---------------- 표현 [전체] 복습 범위 선택 (권/과 구간 + 과·그룹 체크박스) ---------------- */
function exprLessonKey(c){ return (Number(c.book)||0)*1000+(Number(c.lesson)||0); }
function exprGroupKey(c){ return exprLessonKey(c)+'|'+(c.group||''); }
async function openExprScope(){
  const cards = await loadDeck('textbook-expr');
  if(cards.length===0){ toast('등록된 표현이 없어요'); return; }
  const saved = await sGet('expr-review-scope');
  const allIds = new Set(cards.map(c=>c.id));
  let sel = Array.isArray(saved) ? saved.filter(id=>allIds.has(id)) : [];
  if(sel.length===0) sel = cards.map(c=>c.id);
  window._exprScope = {cards, selected:new Set(sel), open:new Set()};
  const lessons = [];
  cards.forEach(c=>{ const k=exprLessonKey(c); if(!lessons.includes(k)) lessons.push(k); });
  lessons.sort((a,b)=>a-b);
  window._exprScope.lessons = lessons;
  const modal = document.getElementById('modalContent');
  modal.innerHTML = `
    <h3>표현 복습 범위 선택</h3>
    <div class="hstack" style="flex-wrap:wrap;align-items:center;margin-bottom:10px;background:var(--paper-2);padding:8px 10px;border-radius:8px;gap:4px;">

      <input type="number" id="esToBook" placeholder="권" inputmode="numeric" style="width:48px;">
      <input type="number" id="esToLesson" placeholder="과" inputmode="numeric" style="width:48px;">
      <button type="button" class="ghost small" onclick="addExprScopeRange()">구간 선택 추가</button>
    </div>
    <label class="hstack" style="align-items:center;margin-bottom:6px;">
      <input type="checkbox" id="esAll"><span><b>전체</b></span>
    </label>
    <div id="exprScopeList" style="max-height:320px;overflow-y:auto;border-top:1px solid var(--line);padding-top:6px;"></div>
    <div class="sub" id="exprScopeCount" style="text-align:center;margin-top:10px;color:var(--ink-soft);"></div>
    <div class="hstack" style="margin-top:10px;">
      <button class="primary" style="flex:1;" onclick="confirmExprScopeAndStart()">복습 시작</button>
      <button class="ghost" style="flex:1;" onclick="closeModal()">닫기</button>
    </div>
  `;
  document.getElementById('modalBg').classList.add('active');
  pushOverlayState();
  document.getElementById('esAll').addEventListener('change', e=>{
    const st = window._exprScope;
    if(e.target.checked) st.cards.forEach(c=>st.selected.add(c.id)); else st.selected.clear();
    renderExprScopeList();
  });
  renderExprScopeList();
}
function exprIdsOfLesson(k){ return window._exprScope.cards.filter(c=>exprLessonKey(c)===k).map(c=>c.id); }
function exprIdsOfGroup(gk){ return window._exprScope.cards.filter(c=>exprGroupKey(c)===gk).map(c=>c.id); }
function renderExprScopeList(){
  const st = window._exprScope;
  const state = ids=>{ const n=ids.filter(id=>st.selected.has(id)).length; return n===0?'none':(n===ids.length?'all':'some'); };
  const html = st.lessons.map(k=>{
    const ids = exprIdsOfLesson(k);
    const s1 = state(ids);
    const book = Math.floor(k/1000), lesson = k%1000;
    const groups = [];
    st.cards.filter(c=>exprLessonKey(c)===k).forEach(c=>{ const g=exprGroupKey(c); if(!groups.includes(g)) groups.push(g); });
    const isOpen = st.open.has(k);
    return `
      <div style="border-bottom:1px solid #F0EBDD;padding:6px 0;">
        <div class="hstack" style="align-items:center;">
          <input type="checkbox" class="es-lesson" data-k="${k}" ${s1==='all'?'checked':''} data-some="${s1==='some'?1:0}">
          <span style="flex:1;font-weight:700;">${book}권 ${lesson}과 <span class="sub" style="font-weight:400;">(${ids.filter(id=>st.selected.has(id)).length}/${ids.length})</span></span>
          <button type="button" class="ghost small" style="padding:2px 8px;" onclick="toggleExprLessonOpen(${k})">${isOpen?'접기 ▲':'그룹 ▼'}</button>
        </div>
        ${isOpen ? `<div style="padding:4px 0 2px 26px;display:flex;flex-wrap:wrap;gap:6px 12px;">
          ${groups.map(gk=>{
            const gids = exprIdsOfGroup(gk); const s2 = state(gids);
            const name = gk.split('|')[1] || '(그룹 없음)';
            return `<label class="hstack" style="align-items:center;gap:4px;font-size:13px;">
              <input type="checkbox" class="es-group" data-g="${esc(gk)}" ${s2==='all'?'checked':''} data-some="${s2==='some'?1:0}">${esc(name)} <span class="sub">${gids.length}</span></label>`;
          }).join('')}
        </div>` : ''}
      </div>`;
  }).join('');
  document.getElementById('exprScopeList').innerHTML = html;
  document.querySelectorAll('#exprScopeList input[data-some="1"]').forEach(cb=>{ cb.indeterminate = true; });
  document.querySelectorAll('.es-lesson').forEach(cb=>cb.addEventListener('change', ()=>{
    const ids = exprIdsOfLesson(Number(cb.dataset.k));
    ids.forEach(id=> cb.checked ? st.selected.add(id) : st.selected.delete(id));
    renderExprScopeList();
  }));
  document.querySelectorAll('.es-group').forEach(cb=>cb.addEventListener('change', ()=>{
    const ids = exprIdsOfGroup(cb.dataset.g);
    ids.forEach(id=> cb.checked ? st.selected.add(id) : st.selected.delete(id));
    renderExprScopeList();
  }));
  const all = document.getElementById('esAll');
  all.checked = st.selected.size===st.cards.length;
  all.indeterminate = st.selected.size>0 && st.selected.size<st.cards.length;
  document.getElementById('exprScopeCount').textContent = st.selected.size+' / '+st.cards.length+'개 선택됨';
}
function toggleExprLessonOpen(k){
  const st = window._exprScope;
  if(st.open.has(k)) st.open.delete(k); else st.open.add(k);
  renderExprScopeList();
}
function addExprScopeRange(){
  const fb = Number(document.getElementById('esFromBook').value);
  const fl = document.getElementById('esFromLesson').value;
  const tb = Number(document.getElementById('esToBook').value);
  const tl = document.getElementById('esToLesson').value;
  if(!fb || fl==='' || !tb || tl===''){ toast('권/과를 모두 입력해주세요'); return; }
  const from = fb*1000+Number(fl), to = tb*1000+Number(tl);
  if(from>to){ toast('시작이 끝보다 늦어요'); return; }
  const st = window._exprScope;
  const matched = st.cards.filter(c=>{ const k=exprLessonKey(c); return k>=from && k<=to; });
  if(matched.length===0){ toast('해당 범위에 표현이 없어요'); return; }
  matched.forEach(c=>st.selected.add(c.id));
  ['esFromBook','esFromLesson','esToBook','esToLesson'].forEach(id=>document.getElementById(id).value='');
  renderExprScopeList();
  toast(fb+'권 '+fl+'과 ~ '+tb+'권 '+tl+'과 ('+matched.length+'개) 선택했어요');
}
async function confirmExprScopeAndStart(){
  const ids = Array.from(window._exprScope.selected);
  if(ids.length===0){ toast('최소 한 문장은 선택해주세요'); return; }
  await sSet('expr-review-scope', ids);
  closeModal();
  startReview('expr', ids);
}

/* ---------------- REVIEW SESSION ---------------- */
let review = null;

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

async function getStarredKeys(){ return (await sGet('starred')) || []; }
async function setStarredKeys(arr){ await sSet('starred', arr); }

async function startReview(deckName, ids){
  const deckKey = deckName==='hsk' ? 'hsk-words' : (deckName==='vocab' ? 'textbook-vocab' : 'textbook-expr');
  const cards = await loadDeck(deckKey);
  let idFilter = null;
  if(deckName==='hsk'){
    idFilter = ids || await getSavedHskScope(cards);
  } else if(deckName==='expr' && ids){
    idFilter = ids;
  }
  const cleared = new Set(await getCleared());
  let queue = computeQueue(deckName, cards, idFilter, cleared);
  if(queue.length===0){ toast('학습 완료! "다시하기"를 누르면 처음부터 다시 볼 수 있어요'); return; }
  queue = deckName==='expr' ? orderExprByGroup(queue, cards) : shuffle(queue);
  const starred = new Set(await getStarredKeys());
  review = {deck:deckName, queue, index:0, stage:'question', starred, mode:'general'};
  document.getElementById('reviewOverlay').classList.add('active');
  pushOverlayState();
  renderReviewStep();
}
async function reviewStarred(deckName){
  const deckKey = deckName==='hsk' ? 'hsk-words' : (deckName==='vocab' ? 'textbook-vocab' : 'textbook-expr');
  const cards = await loadDeck(deckKey);
  const starred = new Set(await getStarredKeys());
  const clearedStarred = new Set(await getClearedStarred());
  const starredCards = cards.filter(c=>starred.has(deckName+':'+c.id));
  if(starredCards.length===0){ toast('⭐ 표시한 단어가 아직 없어요'); return; }
  let queue = computeQueue(deckName, starredCards, null, clearedStarred);
  if(queue.length===0){ toast('즐겨찾기 학습 완료! "다시하기"를 누르면 다시 볼 수 있어요'); return; }
  queue = shuffle(queue);
  review = {deck:deckName, queue, index:0, stage:'question', starred, mode:'starred'};
  document.getElementById('reviewOverlay').classList.add('active');
  pushOverlayState();
  renderReviewStep();
}
function closeReview(){
  document.getElementById('reviewOverlay').classList.remove('active');
  review = null;
  TAB_RENDER[document.querySelector('.tab-btn.active').dataset.tab]();
  consumeOverlayState();
}

function renderReviewStep(){

function setupCanvas(canvas, ch){
  const ctx = canvas.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  canvas.dataset.char = ch;
  canvas._strokes = [];
  let drawing=false, lastX=0, lastY=0, currentStroke=null;
  function pos(e){
    const r = canvas.getBoundingClientRect();
    const cx = (e.touches? e.touches[0].clientX : e.clientX) - r.left;
    const cy = (e.touches? e.touches[0].clientY : e.clientY) - r.top;
    return [cx,cy];
  }
  function start(e){
    drawing=true; [lastX,lastY]=pos(e);
    currentStroke = [{x:lastX,y:lastY}];
    e.preventDefault();
  }
  function move(e){
    if(!drawing) return;
    const [x,y]=pos(e);
    ctx.strokeStyle='#20242A'; ctx.lineWidth=7; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(x,y); ctx.stroke();
    if(currentStroke) currentStroke.push({x,y});
    [lastX,lastY]=[x,y]; e.preventDefault();
  }
  function end(){
    if(drawing && currentStroke && currentStroke.length>1){
      canvas._strokes.push(currentStroke);
      window._strokeLog = window._strokeLog || [];
      window._strokeLog.push(canvas);
    }
    drawing=false; currentStroke=null;
  }
  canvas.addEventListener('pointerdown', start);
  canvas.addEventListener('pointermove', move);
  window.addEventListener('pointerup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
}
function redrawCanvasStrokes(canvas){
  const ctx = canvas.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle='#20242A'; ctx.lineWidth=7; ctx.lineCap='round'; ctx.lineJoin='round';
  (canvas._strokes||[]).forEach(stroke=>{
    ctx.beginPath();
    stroke.forEach((pt,i)=>{ if(i===0) ctx.moveTo(pt.x,pt.y); else ctx.lineTo(pt.x,pt.y); });
    ctx.stroke();
  });
}
function undoStroke(){
  if(!window._strokeLog || window._strokeLog.length===0) return;
  const canvas = window._strokeLog.pop();
  if(canvas._strokes && canvas._strokes.length){
    canvas._strokes.pop();
    redrawCanvasStrokes(canvas);
  }
}
function clearAllCanvases(){
  (window._canvases||[]).forEach(canvas=>{
    canvas._strokes = [];
    const ctx = canvas.getContext('2d');
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  });
  window._strokeLog = [];
}

function tipCharsOf(han){
  const out = [];
  String(han||'').split('').forEach(ch=>{ if(/[\u4e00-\u9fff]/.test(ch) && !out.includes(ch)) out.push(ch); });
  return out;
}

  else review.starred.add(card._key);
  setStarredKeys(Array.from(review.starred));

async function rateCard(rating){
  if(Date.now() < (window._rateLockUntil||0)) return;
  const card = review.queue[review.index];
  if(rating==='good'){
    if(review.mode==='starred'){
      const cleared = await getClearedStarred();
      if(!cleared.includes(card._key)) cleared.push(card._key);
      await setClearedStarred(cleared);
    } else if(review.mode==='mission'){
      const cleared = await getClearedMission();
      if(!cleared.includes(card._key)) cleared.push(card._key);
      await setClearedMission(cleared);
    } else if(review.mode==='m2'){
      await m2Record(review.deck, card.id, true, m2SessDay());
    } else if(review.mode==='m2make'){
      await m2Record(review.deck, card.id, true, review.makeDate);
    } else if(review.mode==='m2redo'){
      /* 일일 미션 다시 하기: 연습이라 아무 기록도 남기지 않아요 */
    } else if(review.mode==='today' || review.mode==='revday'){
      await srsRate(card._deck||review.deck, card.id, true);
    } else {
      const cleared = await getCleared();
      if(!cleared.includes(card._key)) cleared.push(card._key);
      await setCleared(cleared);
      if(review.deck==='hsk') await srsHskNew(card);
    }
  } else {
    if(review.mode==='today' || review.mode==='revday') await srsRate(card._deck||review.deck, card.id, false);
    if(review.mode==='m2') await m2Record(review.deck, card.id, false, m2SessDay());
    if(review.mode==='m2make') await m2Record(review.deck, card.id, false, review.makeDate);
    review.queue.push(card);
  }
  review.index++;
  review.stage = 'question';
  review.skipped = false;
  renderReviewStep();
}

/* =====================================================================
   새 학습 엔진 (2026-10 개편)
   - 카드마다 '다음에 나올 날짜'를 관리하는 간격 반복 (틀리면 내일, 맞히면 3일 → 7일 → 14일(단어는 30일) 후)
   - 이번 주 수업 분량·지난주 놓친 분량은 '필수 암기'(서로 다른 날 2번 맞혀야 완료, 완료 전까지 매일 나옴)
   - 일일 미션은 요일별 고정 배분이 아니라 매일 자동 계산되는 '오늘 할 것'
   - 홈 화면의 학습 비서가 현황·위험·할 일을 알려줌
   ===================================================================== */
const DECKS3 = ['hsk','vocab','expr'];
const DECK_KEY = {hsk:'hsk-words', vocab:'textbook-vocab', expr:'textbook-expr'};
const DECK_NAME_KO = {hsk:'한자', vocab:'단어', expr:'표현'};
const DOW_KO = ['일','월','화','수','목','금','토'];
const SRS_INT = [1,3,7,14,30];
const SRS_MAXIDX = {hsk:3, expr:3, vocab:4};   // 한자·표현 최대 14일, 단어 최대 30일
const SRS_FAST = [1,2,4,7,14];                  // 외운 지 2주 안의 카드는 더 촘촘하게 복습
const FAST_DAYS = 14;
const KEEP_PREV_BOOK_DAYS = 14;                 // 새 권으로 넘어가도 이전 권 표현을 4주간 복습 대상에 남겨요
const CAP_EARLY = 60, CAP_NORMAL = 50;
const FIRST_PASS_PER_DAY = 40;                  // 하루에 '처음 맞히기'를 이보다 많이 해야 하면 '빠듯함'으로 봐요 (실제 배정은 남은 날수로 균등 분배)

/* ---- 저장소 ---- */
async function getSrs(){ return (await sGet('srs')) || {}; }
async function setSrs(o){ await sSet('srs', o); }
async function getSettings(){
  const s = (await sGet('srs-settings')) || {};
  const q = Object.assign({expr:30, vocab:33, hsk:8}, s.quota||{});
  return Object.assign({nextLesson:'', lessonDates:[], reviewDay:3, startDate:''}, s, {quota:q, capEarly:CAP_EARLY, capNormal:CAP_NORMAL});
}
async function setSettings(s){ await sSet('srs-settings', s); }

/* ---- 날짜 도우미 ---- */
function diffDays(a,b){ return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); }
function fmtMD(ds){ const d=new Date(ds+'T00:00:00'); return (d.getMonth()+1)+'/'+d.getDate()+'('+DOW_KO[d.getDay()]+')'; }
function fmtLesson(s){
  if(!s.nextLesson) return '';
  const ds = s.nextLesson.slice(0,10), t = s.nextLesson.slice(11,16) || '';
  let tt = '';
  if(t){ let [h,m] = t.split(':').map(Number); const ap = h<12?'오전':'오후'; let hh = h%12; if(hh===0) hh=12; tt = ' '+ap+' '+hh+'시'+(m?(' '+m+'분'):''); }
  return fmtMD(ds)+tt;
}
function lessonDateOf(s){ return s.nextLesson ? s.nextLesson.slice(0,10) : null; }
function pastLessons(s){ return (s.lessonDates||[]).filter(d=>d<=todayStr()).sort(); }
function lastLessonDate(s){ const a=pastLessons(s); return a.length?a[a.length-1]:null; }
function prevLessonDate(s){ const a=pastLessons(s); return a.length>1?a[a.length-2]:(a.length?a[a.length-1]:null); }
function normAny(t){ return String(t||'').toLowerCase().replace(/[^\p{L}\p{N}]/gu,''); }
function splitKey(key){ const i=key.indexOf(':'); return [key.slice(0,i), key.slice(i+1)]; }

/* ---- 카드 상태 ---- */
function isReqOpen(e){ return !!(e && e.req && !e.done); }
function markReq(srs, deck, id, kind, cycle){
  const key = deck+':'+id;
  const e = srs[key] || {st:0};
  e.req = kind; e.cycle = cycle; e.done = false; e.days = []; e.added = todayStr(); e.born = e.born || todayStr(); e.due = todayStr();
  srs[key] = e;
}
async function srsRate(deck, id, good){
  const srs = await getSrs(); const today = todayStr(); const key = deck+':'+id;
  const e = srs[key] || {st:0, due:today};
  if(!e.first) e.first = today;
  if(good){
    if(e.lastGood===today && e.lastWrong!==today){ srs[key]=e; await setSrs(srs); return; }   // 오늘 이미 맞힌 카드 — 중복 반영 안 함
    const wrongToday = e.lastWrong===today;
    e.lastGood = today;
    if(isReqOpen(e)){
      e.days = e.days || [];
      if(!wrongToday && !e.days.includes(today)) e.days.push(today);   // 오늘 한 번이라도 틀렸으면 오늘은 '맞힌 날'로 안 쳐요
      if(e.days.length>=2){ e.done = true; e.st = 1; e.due = addDays(today, srsIntervalDays(e, deck, 1)); delete e.reqDue; }
      else {
        e.st = 0; e.due = addDays(today, 1);
        // 두 번째로 맞힐 날을 과외 전날까지의 날들 중 가장 한가한 날로 (시험에 가까운 날 우선)
        const eve = lessonEve(await getSettings());
        const cnt = {};
        Object.values(srs).forEach(x=>{ if(x!==e && x.req && !x.done && x.reqDue) cnt[x.reqDue] = (cnt[x.reqDue]||0)+1; });
        let best = addDays(today,1);
        if(eve && eve>today){
          let bc = 1e9;
          for(let d=addDays(today,1); d<=eve; d=addDays(d,1)){ const c = cnt[d]||0; if(c<=bc){ bc=c; best=d; } }
        }
        e.reqDue = best;
      }
    } else if(wrongToday){ e.st = 0; e.due = addDays(today, 1); }
    else { e.st = Math.min((e.st||0)+1, SRS_MAXIDX[deck]); e.due = addDays(today, srsIntervalDays(e, deck, e.st)); }
  } else {
    e.lastWrong = today; e.st = 0; e.due = addDays(today, 1);
    if(e.days) e.days = e.days.filter(d=>d!==today);
    if(isReqOpen(e) && (e.days||[]).length>=1) e.reqDue = addDays(today,1);
  }
  srs[key] = e;
  await setSrs(srs);
}
/* 한자 '신규 암기'(전체 복습)에서 정답으로 외운 한자는 유지 복습 대상으로 들어가요 */
async function srsHskNew(card){
  const srs = await getSrs(); const today = todayStr(); const key = 'hsk:'+card.id;
  if(srs[key]) return;
  srs[key] = {st:0, due:addDays(today,1), first:today, born:today, lastGood:today};
  await setSrs(srs);
}

async function loadAllDecks(){
  const [hsk,vocab,expr] = await Promise.all(DECKS3.map(d=>loadDeck(DECK_KEY[d])));
  return {hsk,vocab,expr};
}
function dailyCap(s){
  if(s.startDate==null) return CAP_NORMAL;
  const days = s.startDate ? diffDays(s.startDate, todayStr()) : 99;
  return days < 14 ? s.capEarly : s.capNormal;
}
function curBookOf(expr){ return expr.reduce((m,c)=>Math.max(m, Number(c.book)||0), 0); }
function exprInScope(s){
  const cur = s.bookSince ? Number(s.bookSince.book) : 0, since = s.bookSince ? s.bookSince.since : '';
  const keepPrev = since && diffDays(since, todayStr()) <= KEEP_PREV_BOOK_DAYS;
  return c=>{ const b = Number(c.book)||0; return b>=cur || (keepPrev && b===cur-1); };
}
async function trackBook(decks, s){
  const cur = curBookOf(decks.expr);
  if(cur && (!s.bookSince || Number(s.bookSince.book)!==cur)){
    s.bookSince = {book:cur, since: s.bookSince ? todayStr() : '2000-01-01'};
    await setSettings(s);
  }
}
function autoQuota(d, unseen, s){
  const elapsed = s.startDate ? Math.max(0, diffDays(s.startDate, todayStr())) : 0;
  return Math.ceil(unseen / Math.max(1, FIRST_HORIZON[d] - elapsed));
}
async function buildPlan(decks, srs, s){
  const today = todayStr();
  const ids = {hsk:[], vocab:[], expr:[]};
  const exists = {}; DECKS3.forEach(d=>{ exists[d] = new Set(decks[d].map(c=>c.id)); });
  const dueList = []; let reqCount = 0; const pool0 = [];
  const eve = lessonEve(s); const allReq = !eve || today>=eve;   // 과외 전날부터는 남은 필수 카드를 전부
  const inScope = exprInScope(s); const exprById = new Map(decks.expr.map(c=>[c.id,c]));
  Object.entries(srs).forEach(([key,e])=>{
    const [deck,id] = splitKey(key);
    if(!exists[deck] || !exists[deck].has(id)) return;
    if(isReqOpen(e)){
      const days = e.days||[];
      if(days.length===0) pool0.push({deck,id,wrong:e.lastWrong?1:0});
      else if(allReq || reqDueOf(e)<=today){ ids[deck].push(id); reqCount++; }
    }
    else if(e.due && e.due<=today){
      if(deck==='expr'){ const c = exprById.get(id); if(!c || !inScope(c)) return; }
      dueList.push({deck,id,due:e.due,st:e.st||0});
    }
  });
  {
    const take = allReq ? pool0 : (()=>{
      const wrongs = pool0.filter(x=>x.wrong);
      const fresh = pool0.filter(x=>!x.wrong);
      // 남은 '맞히기 횟수'(처음 + 두 번째)를 남은 날수로 고르게 나눠, 오늘 처음 맞힐 개수를 정해요
      const days = Math.max(1, diffDays(today, eve)+1);
      let rem2 = 0; Object.values(srs).forEach(e=>{ if(isReqOpen(e) && (e.days||[]).length>=1) rem2++; });
      const T = Math.ceil((2*pool0.length + rem2) / days);
      let room = today>=eve ? pool0.length : Math.max(0, Math.min(pool0.length, T - reqCount) - wrongs.length);
      const E = fresh.filter(x=>x.deck==='expr'), V = fresh.filter(x=>x.deck!=='expr');
      const nE = fresh.length ? Math.round(room * E.length / fresh.length) : 0;
      const order = new Map(decks.expr.map((c,i)=>[c.id,i]));
      E.sort((a,b)=>order.get(a.id)-order.get(b.id));
      const pickE = E.slice(0, nE);
      // 같은 그룹은 같은 날 함께 (그룹이 중간에 잘리면 그룹 끝까지 포함)
      const gk = id=>{ const c = exprById.get(id); return c ? (c.book??'')+'-'+(c.lesson??'')+'-'+(c.group||'') : id; };
      while(pickE.length && pickE.length<E.length && gk(E[pickE.length].id)===gk(pickE[pickE.length-1].id)) pickE.push(E[pickE.length]);
      const nV = Math.max(0, room - pickE.length);
      return wrongs.concat(pickE, V.slice(0, nV));
    })();
    take.forEach(x=>{ ids[x.deck].push(x.id); reqCount++; });
  }
  let remaining = Math.max(0, dailyCap(s) - reqCount);
  dueList.sort((a,b)=> a.due<b.due?-1 : a.due>b.due?1 : a.st-b.st);
  const takenDue = dueList.slice(0, remaining);
  takenDue.forEach(x=>ids[x.deck].push(x.id));
  remaining -= takenDue.length;
  // 첫 점검: 아직 한 번도 안 본 카드를 하루 정해진 개수만큼 (표현 → 단어 → 한자 순)
  const firstToday = {hsk:0, vocab:0, expr:0};
  Object.entries(srs).forEach(([key,e])=>{ const [d]=splitKey(key); if(e.first===today && !e.req) firstToday[d]++; });
  const picked = new Set(Object.keys(srs));
  const hskPool = new Set((await sGet('srs-hsk-pool'))||[]);
  const unseen = {
    expr: decks.expr.filter(c=>inScope(c) && !picked.has('expr:'+c.id)).length,
    vocab: decks.vocab.filter(c=>!picked.has('vocab:'+c.id)).length,
    hsk: decks.hsk.filter(c=>hskPool.has(c.id) && !picked.has('hsk:'+c.id)).length
  };
  const takeFor = d => Math.max(0, Math.min(autoQuota(d, unseen[d] + firstToday[d], s) - firstToday[d], remaining));
  // 표현: 그룹 단위로, 가장 최근 과부터
  let n = takeFor('expr');
  if(n>0){
    const groups = new Map();
    decks.expr.forEach(c=>{ if(picked.has('expr:'+c.id) || !inScope(c)) return; const g=(c.book??'')+'-'+(c.lesson??'')+'-'+(c.group||''); if(!groups.has(g)) groups.set(g,[]); groups.get(g).push(c); });
    const arr = [...groups.values()].reverse();
    let got = 0;
    for(const grp of arr){ if(got>=n) break; for(const c of grp){ if(got>=remaining) break; ids.expr.push(c.id); got++; } }
    remaining -= got;
  }
  n = takeFor('vocab');
  if(n>0){
    const list = decks.vocab.filter(c=>!picked.has('vocab:'+c.id)).reverse().slice(0,n);
    list.forEach(c=>ids.vocab.push(c.id)); remaining -= list.length;
  }
  n = takeFor('hsk');
  if(n>0){
    const pool = hskPool;
    const list = decks.hsk.filter(c=>pool.has(c.id) && !picked.has('hsk:'+c.id))
      .sort((a,b)=> (Number(b.level)-Number(a.level)) || (Number(b.no)-Number(a.no))).slice(0,n);
    list.forEach(c=>ids.hsk.push(c.id)); remaining -= list.length;
  }
  return {date:today, ids};
}
function planLeftCount(plan, srs){
  let n = 0; const day = plan.date;
  DECKS3.forEach(d=>{ plan.ids[d].forEach(id=>{ const e=srs[d+':'+id]; if(!(e && e.lastGood===day)) n++; }); });
  return n;
}

  const today = todayStr();

  if(!plan || plan.date!==today){
    if(plan && plan.date){
      const hist = (await sGet('srs-hist')) || {};
      hist[plan.date] = {total: DECKS3.reduce((a,d)=>a+plan.ids[d].length,0), left: planLeftCount(plan, srs)};
      await sSet('srs-hist', hist);
    }
    plan = await buildPlan(decks, srs, s);
    await sSet('srs-plan', plan);
  } else {
    let changed = false;
    const exists = {}; DECKS3.forEach(d=>{ exists[d] = new Set(decks[d].map(c=>c.id)); });
    Object.entries(srs).forEach(([key,e])=>{
      if(!isReqOpen(e)) return;

    });
    if(changed) await sSet('srs-plan', plan);
  }
  return plan;
}
function planRemaining(plan, srs, deck){
  const today = todayStr();

function orderForReview(deck, list, deckCards, srs){
  const isReq = c=>isReqOpen(srs[deck+':'+c.id]);
  const a = list.filter(isReq), b = list.filter(c=>!isReq(c));
  const f = deck==='expr' ? (x=>orderExprByGroup(x, deckCards)) : shuffle;
  return f(a).concat(f(b));
}
async function openSessionOf(deck, list, deckCards, srs, mode){
  const queue = orderForReview(deck, list, deckCards, srs).map(c=>({...c, _key:deck+':'+c.id}));
  const starred = new Set(await getStarredKeys());
  review = {deck, queue, index:0, stage:'question', starred, mode};
  document.getElementById('reviewOverlay').classList.add('active');
  pushOverlayState();
  renderReviewStep();
}
async function startToday(deck){
  const [decks, srs, s] = await Promise.all([loadAllDecks(), getSrs(), getSettings()]);
  const plan = await ensurePlan(decks, srs, s);
  const byId = new Map(decks[deck].map(c=>[c.id,c]));
  const list = planRemaining(plan, srs, deck).map(id=>byId.get(id)).filter(Boolean);
  if(list.length===0){ toast(DECK_NAME_KO[deck]+' 오늘 할 것을 모두 끝냈어요'); return; }
  openSessionOf(deck, list, decks[deck], srs, 'today');
}
function revDayIds(decks, srs, s){
  const cycles = new Set([lastLessonDate(s), prevLessonDate(s)].filter(Boolean));
  const since = addDays(todayStr(), -14);
  const out = {hsk:[], vocab:[], expr:[]};
  const exists = {}; DECKS3.forEach(d=>{ exists[d] = new Set(decks[d].map(c=>c.id)); });
  Object.entries(srs).forEach(([key,e])=>{
    const [deck,id] = splitKey(key);
    if(!exists[deck] || !exists[deck].has(id)) return;
    if((e.req && cycles.has(e.cycle)) || (e.lastWrong && e.lastWrong>=since)) out[deck].push(id);
  });
  return out;
}
async function startRevDay(deck){
  const [decks, srs, s] = await Promise.all([loadAllDecks(), getSrs(), getSettings()]);
  const ids = new Set(revDayIds(decks, srs, s)[deck]);
  const list = decks[deck].filter(c=>ids.has(c.id));
  if(list.length===0){ toast('복습일에 점검할 '+DECK_NAME_KO[deck]+' 카드가 없어요'); return; }
  openSessionOf(deck, list, decks[deck], srs, 'revday');
}

function insertByLesson(deck, items){
  items.forEach(it=>{
    const myKey = (Number(it.book)||0)*1000+(Number(it.lesson)||0);
    let pos = -1;
    for(let i=0;i<deck.length;i++){ const c=deck[i]; if(c.book!=null && ((Number(c.book)||0)*1000+(Number(c.lesson)||0))<=myKey) pos=i; }
    if(pos<0) deck.push(it); else deck.splice(pos+1,0,it);
  });
  return deck;
}
function parseExprRaw(raw){
  return raw.trim().split('\n').map(line=>{ const [ko,py,book,lesson,group]=line.split('\t'); return {ko,py,book:Number(book),lesson:Number(lesson),group}; });
}

async function syncHsk3V1(){
  const hsk = await loadDeck('hsk-words');
  const have = new Set(hsk.filter(c=>String(c.level)==='3').map(c=>Number(c.no)));
  const add = parseHSKSeed(HSK3_RAW, '3').filter(c=>!have.has(c.no));   // 이미 들어간 번호는 건너뛰고 빠진 것만 추가
  if(add.length===0) return;
  await saveDeck('hsk-words', hsk.concat(add));
}
async function srsInitV1(){
  if(await sGet('srs-init-v1')) return;
  const today = todayStr();
  // 1) 지금까지의 '정답 완료' 기록은 처음부터 다시 (즐겨찾기 표시는 그대로)
  await setCleared([]); await setClearedMission([]); await setClearedStarred([]);
  // 2) 설정
  const s = await getSettings();
  s.nextLesson = '2026-10-15T10:00'; s.lessonDates = [LESSON_PREV, LESSON_THIS]; s.reviewDay = 3; s.startDate = today;
  await setSettings(s);
  const srs = {};
  // 3) 단어
  const vocab = await loadDeck('textbook-vocab');
  VOCAB_NEW_RAW.trim().split('\n').forEach(line=>{
    const [py,ko] = line.split('\t');
    let card = vocab.find(c=>normVocabPy(c.py)===normVocabPy(py) && c.ko===ko);
    if(!card){ card = {id:uid('vocab'), py, ko}; vocab.push(card); }
    markReq(srs,'vocab',card.id,'tw',LESSON_THIS);
  });
  VOCAB_EXIST_RAW.trim().split('\n').forEach(line=>{
    const [py,ko] = line.split('\t');
    let card = vocab.find(c=>normVocabPy(c.py)===normVocabPy(py));
    if(!card){ card = {id:uid('vocab'), py, ko}; vocab.push(card); }
    markReq(srs,'vocab',card.id,'tw',LESSON_THIS);
  });
  await saveDeck('textbook-vocab', vocab);
  // 4) 표현
  const expr = await loadDeck('textbook-expr');
  const fresh = [];
  [[EXPR_TW_RAW,'tw',LESSON_THIS],[EXPR_MISSED_RAW,'missed',LESSON_PREV]].forEach(([raw,kind,cycle])=>{
    parseExprRaw(raw).forEach(r=>{
      let card = expr.concat(fresh).find(c=>Number(c.book)===r.book && Number(c.lesson)===r.lesson && normAny(c.py)===normAny(r.py));
      if(!card){ card = {id:uid('expr'), ...r}; fresh.push(card); }
      markReq(srs,'expr',card.id,kind,cycle);
    });
  });
  insertByLesson(expr, fresh);
  await saveDeck('textbook-expr', expr);
  // 5) 한자: 1급 전체 + 2급 1~110번은 '이미 외운 한자'(첫 점검 대상), 이번 주 신규 = 2급 111~126
  const hsk = await loadDeck('hsk-words');
  await sSet('srs-hsk-pool', hsk.filter(c=>String(c.level)==='1' || (String(c.level)==='2' && Number(c.no)<=110)).map(c=>c.id));
  await sSet('hsk-review-scope', hsk.filter(c=>String(c.level)==='2' && Number(c.no)>=111 && Number(c.no)<=126).map(c=>c.id));
  await sSet('hsk-range-set', LESSON_THIS);
  await setSrs(srs);
  await sSet('srs-plan', null);
  await sSet('srs-init-v1', true);
}

const LEVEL_RANK = {ok:0, warn:1, bad:2};
function analyzeState(decks, srs, s, plan, hist, hskScopeInfo){
  const today = todayStr(); const now = new Date();
  const ld = lessonDateOf(s);
  const lessonAt = s.nextLesson ? new Date(s.nextLesson) : null;
  const passed = !!(lessonAt && now > lessonAt);
  const lastL = lastLessonDate(s);
  const exists = {}; DECKS3.forEach(d=>{ exists[d] = new Set(decks[d].map(c=>c.id)); });
  // 필수 암기 집계
  const stat = {vocab:{tw:{t:0,d:0}, missed:{t:0,d:0}, old:{t:0,d:0}}, expr:{tw:{t:0,d:0}, missed:{t:0,d:0}, old:{t:0,d:0}}};
  const open = [];
  let addedThisWeek = 0;
  Object.entries(srs).forEach(([key,e])=>{
    const [deck,id] = splitKey(key);
    if(!e.req || !exists[deck] || !exists[deck].has(id)) return;
    let bucket;
    if(e.cycle===lastL && e.req==='tw') bucket='tw';
    else if(e.req==='missed' && e.cycle===prevLessonDate(s)) bucket='missed';
    else bucket='old';
    if(stat[deck]){ stat[deck][bucket].t++; if(e.done) stat[deck][bucket].d++; }
    if(lastL && e.added && e.added>=lastL) addedThisWeek++;
    if(!e.done){
      const days = e.days || [];
      const doneToday = days.includes(today);
      const wrongToday = e.lastWrong===today;

  // 오늘 계획
  const left = {}; let leftTotal = 0, planTotal = 0;
  DECKS3.forEach(d=>{ left[d] = planRemaining(plan, srs, d).length; leftTotal += left[d]; planTotal += plan.ids[d].length; });
  // 위험도 계산
  let level = 'ok';
  const raise = l=>{ if(LEVEL_RANK[l]>LEVEL_RANK[level]) level = l; };
  const msgs = [];       // {kind:'bad'|'warn'|'info', text, action?}
  const daysToLesson = ld ? diffDays(today, ld) : null;
  let finishDate = null, slack = null, avail = 0, n0 = 0, perDay = 0;
  if(!ld){ raise('bad'); msgs.push({kind:'bad', text:'다음 과외 날짜가 입력되어 있지 않아요. 날짜가 있어야 이번 주 준비가 충분한지 계산할 수 있어요.', action:'settings'}); }
  else if(passed){ raise('bad'); msgs.push({kind:'bad', text:'입력된 과외 시간('+fmtLesson(s)+')이 지났어요. 새 과외 날짜를 입력하고 오늘 수업 분량을 추가해주세요.', action:'settings'}); }
  else if(open.length>0){
    const eveD = addDays(ld,-1);
    avail = Math.max(0, diffDays(today, eveD)+1);          // 오늘~과외 전날까지 쓸 수 있는 날 수
    n0 = open.filter(o=>o.need===2).length;
    perDay = Math.ceil((2*n0 + open.filter(o=>o.need===1).length) / Math.max(1, avail));                  // 아직 한 번도 못 맞힌 필수 카드
    const minDays = n0>0 ? Math.ceil(n0/FIRST_PASS_PER_DAY)+1 : 1;   // 처음 맞히는 날들 + 두 번째 맞히는 날
    slack = avail - minDays;
    if(slack<0){ raise('bad'); msgs.push({kind:'bad', text:'남은 필수 카드를 과외 전에 "서로 다른 날 2번 맞히기"까지 끝낼 시간이 부족해요. 오늘 가능한 만큼 최대한 하고, 과외 때 헷갈릴 수 있다는 점을 감안해주세요.'}); }
    else if(slack===0){ raise('warn'); msgs.push({kind:'warn', text:'여유가 하루도 없어요. 오늘부터 하루도 빠지지 않고 해야 과외 전에 끝나요.'}); }
  }
  // 어제 못 한 것
  const y = addDays(today,-1);
  const yh = hist[y];

  // 필수 설정 점검
  const rangeSet = hskScopeInfo.rangeSet;
  if(lastL && (!rangeSet || rangeSet<lastL)){ raise('warn'); msgs.push({kind:'warn', text:'이번 주 신규 한자 범위를 아직 정하지 않았어요. 한자 카드의 "복습 시작"에서 범위를 골라주세요.', action:'hsk'}); }
  if(lastL && addedThisWeek===0){ raise('warn'); msgs.push({kind:'warn', text:'이번 주 수업 분량(단어·표현)이 아직 하나도 등록되지 않았어요. 사진을 정리해서 "+ 표현 추가", "+ 단어 추가"에 넣어주세요.'}); }
  if(s.reviewDay==null){ raise('warn'); msgs.push({kind:'warn', text:'복습일 요일이 정해져 있지 않아요.', action:'settings'}); }
  return {planBy:{hsk:plan.ids.hsk.length, vocab:plan.ids.vocab.length, expr:plan.ids.expr.length}, level, msgs, stat, open, hskTodo:(hskScopeInfo.total-hskScopeInfo.done), left, leftTotal, planTotal, daysToLesson, finishDate, slack, avail, n0, perDay, passed, lessonAt, ld, lastL};
}
function exprExamStats(decks, srs){
  const cur = curBookOf(decks.expr), today = todayStr(), since = addDays(today,-7);
  const cards = decks.expr.filter(c=>Number(c.book)===cur);
  let sure=0, shaky=0, unseen=0;
  cards.forEach(c=>{
    const e = srs['expr:'+c.id];
    if(!e || (!e.first && !e.req && !e.lastGood && !e.lastWrong)){ unseen++; return; }
    const solid = !isReqOpen(e) && (e.st||0)>=2 && !(e.lastWrong && e.lastWrong>=since) && !(e.due && e.due<today);
    if(solid) sure++; else shaky++;
  });
  return {cur, total:cards.length, sure, shaky, unseen};
}
function reqRow(label, o){
  if(!o || o.t===0) return '';
  const rest = o.t-o.d;
  return `<div class="sub" style="margin:2px 0;">${label}: <b>${o.d}/${o.t}</b> 완료${rest>0?` <span style="color:var(--seal);">(남음 ${rest})</span>`:' ✓'}</div>`;
}
function isSolid(e, today){
  const since = addDays(today,-7);
  return !!(e && !isReqOpen(e) && (e.st||0)>=2 && !(e.lastWrong && e.lastWrong>=since) && !(e.due && e.due<today));
}
function seenAny(e){ return !!(e && (e.first || e.req || e.lastGood || e.lastWrong)); }
function condBar(sure, shaky, rest){
  const t = Math.max(1, sure+shaky+rest);
  const w = n => (n/t*100).toFixed(1)+'%';
  return `<div style="display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--paper-2);margin:5px 0 3px;">
    <div style="width:${w(sure)};background:var(--jade);"></div><div style="width:${w(shaky)};background:var(--gold);"></div><div style="width:${w(rest)};background:#D9D2BF;"></div></div>`;
}
function condRow(label, sure, shaky, rest, nm){
  const parts = [];
  if(sure>0 || nm[0]) parts.push(`<b style="color:var(--jade);">${nm[0]} ${sure}</b>`);
  if(nm[1]) parts.push(`<b style="color:var(--gold);">${nm[1]} ${shaky}</b>`);
  parts.push(`<b style="color:var(--ink-soft);">${nm[2]} ${rest}</b>`);
  return `<div style="padding:7px 0;border-top:1px solid #F0EBDD;">
    <div class="row-between" style="font-size:13px;"><b>${label}</b><span class="sub">총 ${sure+shaky+rest}개</span></div>
    ${condBar(sure, shaky, rest)}
    <div class="sub">${parts.join(' · ')}</div></div>`;
}
function weeklyCond(srs, deck, cards, pick){
  let d=0, p=0, n=0;
  cards.forEach(c=>{ const e=srs[deck+':'+c.id]; if(!e||!e.req||!pick(e)) return; if(e.done) d++; else if((e.days&&e.days.length)||e.lastWrong) p++; else n++; });
  return [d,p,n];
}

async function submitImport(deck){
  const text = document.getElementById('importText').value.trim();
  if(!text){ toast('내용을 입력해주세요'); return; }
  const wantStar = document.getElementById('importStar').checked;
  const reqSel = document.getElementById('importReq');
  const reqKind = reqSel ? reqSel.value : 'none';
  const level = deck==='hsk' ? (document.getElementById('importLevel').value || '2') : null;
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  const deckKey = DECK_KEY[deck];
  const existing = await loadDeck(deckKey);
  const s = await getSettings();
  const srs = await getSrs();
  const newItems = [], dupItems = []; let bad = 0;
  const pending = [];
  lines.forEach(line=>{
    let parts;
    if(line.includes('|')) parts = line.split('|').map(x=>x.trim());
    else if(line.includes('\t')) parts = line.split('\t').map(x=>x.trim());
    else parts = line.split(/\s{2,}/).map(x=>x.trim());
    if(deck==='hsk'){
      if(parts.length<3){ bad++; return; }
      const [han,py,en,ko] = [parts[0], parts[1], parts[2]||'', parts[3]||parts[2]||''];
      const item = {id:uid('hsk'), no: existing.length+newItems.length+1, han:han.trim(), py:py.trim(), en:en.trim(), ko:ko.trim(), level};
      existing.push(item); newItems.push(item);
    } else if(deck==='expr'){
      if(parts.length<2){ bad++; return; }
      const [ko,py,book,lesson,group] = parts;
      const bk = book?Number(book):null, ls = lesson?Number(lesson):null;
      const hit = existing.concat(pending).find(c=>normAny(c.py)===normAny(py) && (Number(c.book)||0)===(bk||0) && (Number(c.lesson)||0)===(ls||0));
      if(hit){ dupItems.push(hit); return; }
      const item = {id:uid('expr'), py:(py||'').trim(), ko:(ko||'').trim(), book:bk, lesson:ls, group: group?group.trim():null};
      pending.push(item); newItems.push(item);
    } else {
      if(parts.length<2){ bad++; return; }
      const [py,ko] = [parts[0], parts[1]];
      const hit = existing.concat(pending).find(c=>normVocabPy(c.py)===normVocabPy(py) && c.ko===ko);
      if(hit){ dupItems.push(hit); return; }
      const item = {id:uid(deck), py:py.trim(), ko:ko.trim()};
      pending.push(item); newItems.push(item);
    }
  });
  if(newItems.length===0 && dupItems.length===0){ toast('인식된 줄이 없어요. 형식을 확인해주세요'); return; }
  if(deck==='expr'){ insertByLesson(existing, pending); }
  else if(deck==='vocab'){ pending.forEach(x=>existing.push(x)); }
  await saveDeck(deckKey, existing);
  if(wantStar){
    const starred = await getStarredKeys();
    newItems.concat(dupItems).forEach(item=>starred.push(deck+':'+item.id));
    await setStarredKeys(Array.from(new Set(starred)));
  }
  if(deck!=='hsk' && reqKind!=='none'){
    const cycle = reqKind==='tw' ? (lastLessonDate(s)||todayStr()) : (prevLessonDate(s)||todayStr());
    newItems.concat(dupItems).forEach(item=>markReq(srs, deck, item.id, reqKind, cycle));
    await setSrs(srs);
    await sSet('srs-plan', null);   // 새로 필수로 등록했으니 오늘 계획을 다시 만들어요
  }
  closeModal();
  const parts = [];
  if(newItems.length) parts.push(newItems.length+'개 추가');
  if(dupItems.length) parts.push('이미 있는 '+dupItems.length+'개'+(reqKind!=='none'&&deck!=='hsk'?'는 필수로만 표시':'는 건너뜀'));
  if(bad) parts.push('인식 안 된 '+bad+'줄');
  if(reqKind!=='none' && deck!=='hsk') parts.push('필수 암기로 등록');
  toast(parts.join(' · '));
  if(deck==='hsk') renderHskTab(); else if(deck==='vocab') renderVocabTab(); else renderExprTab();
}

/* =====================================================================
   일일 미션 v2 (2026-10-15 단순화)
   - 과외가 끝나면 '다음 과외 날짜·시간'을 입력 → 그 날짜가 이번 주기(cycle)
   - 카드(한자/단어/표현)마다 '이번 주 새 분량'과 '예전 복습' 범위를 직접 고름
   - 앱이 과외 전날까지 남은 날로 나눠 매일 미션을 만듦 (빠진 날이 있으면 남은 날로 다시 나눔)
   - 새 분량: 서로 다른 날 2번 맞혀야 끝 / 예전 복습: 한 바퀴
   - 틀린 문제: 그 자리에서 맨 끝에 다시 → 다음 날 한 번 더 → 과외 전날 이번 주 틀린 것 전부 다시
   ===================================================================== */
const M2_DECKS = ['hsk','vocab','expr'];
const M2_NAME = {hsk:'한자', vocab:'단어', expr:'표현'};
const M2_ICON = {hsk:'✍️', vocab:'📖', expr:'💬'};

function m2Cycle(s){ return s.nextLesson || ''; }
function m2LessonDate(s){ return s.nextLesson ? s.nextLesson.slice(0,10) : null; }
function m2LessonOk(s){ const d = m2LessonDate(s); return !!(d && d > todayStr()); }
function m2Eve(s){ return addDays(m2LessonDate(s), -1); }
function m2FmtLesson(s){
  const d = new Date(s.nextLesson);
  const W = ['일','월','화','수','목','금','토'];
  let h = d.getHours(), m = d.getMinutes();
  const ap = h<12 ? '오전' : '오후'; let hh = h%12; if(hh===0) hh=12;
  return (d.getMonth()+1)+'/'+d.getDate()+'('+W[d.getDay()]+') '+ap+' '+hh+'시'+(m?(' '+m+'분'):'');
}

async function m2GetRange(deck){ return (await sGet('m2-range-'+deck)) || null; }
async function m2GetProg(cycle){
  const p = await sGet('m2-prog');
  if(!p || p.cycle!==cycle) return {cycle, cards:{}};
  return p;
}
async function m2GetDone(){
  const d = await sGet('m2-done');
  if(!d || d.date!==todayStr()) return {date:todayStr(), keys:[]};
  return d;
}

/* 표현은 그룹(권-과-그룹)이 쪼개지지 않게 앞에서부터 묶음 단위로 자름 */
function m2TakeChunk(deck, cards, n){
  if(n<=0) return [];
  if(deck!=='expr') return cards.slice(0, n);
  const out = []; let i = 0;
  while(i<cards.length && out.length<n){
    const g = (cards[i].book??'')+'-'+(cards[i].lesson??'')+'-'+(cards[i].group||'');
    while(i<cards.length && ((cards[i].book??'')+'-'+(cards[i].lesson??'')+'-'+(cards[i].group||''))===g){ out.push(cards[i]); i++; }
  }
  return out;
}

/* 오늘 미션 계산 (하루에 한 번 만들고, 범위를 바꾸면 다시 만듦) */
function m2FirstOf(e){
  if(e.first) return e.first;
  const all = (e.days||[]).concat(e.wrong||[]).sort();
  return all[0] || null;
}
function m2BuildDeckPlan(deck, deckCards, range, prog, s, doneToday, fixedAll){
  const t = todayStr();
  if(!range || range.cycle!==m2Cycle(s)) return null;           // 이번 주기 범위를 아직 안 정함
  const isNew = new Set(range.new||[]), isOld = new Set(range.old||[]);
  const P = k=>prog.cards[k] || {};
  const startOf = range.start || {};
  const touched = c=>{ const e = P(deck+':'+c.id); return doneToday.has(deck+':'+c.id) || m2FirstOf(e)===t; };
  const inRange = deckCards.filter(c=>(isNew.has(c.id) || isOld.has(c.id)) && !(startOf[c.id] && startOf[c.id] > t));
  const eve = m2Eve(s);
  const D = Math.max(1, diffDays(t, eve)+1);
  const retry = [], second = [], fresh = [], introduced = [], oldPend = [], wrongAll = [], todayDone = [];
  let newToday = 0, oldToday = 0;
  inRange.forEach(c=>{
    const e = P(deck+':'+c.id);
    const first = m2FirstOf(e);
    const tt = touched(c);
    if(tt) todayDone.push(c);                                   // 오늘 이미 푼 것도 오늘 목록에 남겨요 (다시 하기용)
    if(e.lastWrongOpen && e.lastWrongOpen < t) retry.push(c);
    if((e.wrong||[]).length) wrongAll.push(c);
    if(isNew.has(c.id)){
      const days = e.days||[];
      if(!first && !tt){ fresh.push(c); return; }
      introduced.push(c);
      if(tt) newToday++;
      if(days.length<2 && !days.includes(t) && first && first < t) second.push(c);
    } else {
      if(tt) oldToday++;
      else if(!e.cleared) oldPend.push(c);
    }
  });
  let pick;
  const FX = fixedAll && fixedAll.cycle===m2Cycle(s) && fixedAll.decks && fixedAll.decks[deck];
  if(FX){
    // 이번 주 고정 배치 (반복 없음): 오늘 몫 + 지난날 몫 중 아예 안 푼 것
    const todayIds = new Set(FX[t]||[]);
    const notYet = c=>{ const f = m2FirstOf(P(deck+':'+c.id)); return !f || f >= t; };
    const carry = inRange.filter(c=>Object.keys(FX).some(d=>d<t && (FX[d]||[]).includes(c.id)) && notYet(c));
    const allFx = new Set([].concat(...Object.values(FX)));
    const extra = inRange.filter(c=>!allFx.has(c.id) && notYet(c));   // 나중에 범위에 직접 추가한 것
    pick = [].concat(inRange.filter(c=>todayIds.has(c.id)), carry, extra);
  } else if(t >= eve){
    // 과외 전날: 남은 것 전부 + 이번 주에 한 번이라도 틀린 것 전부 (한자 새 분량은 전부)
    const allNew = deck==='hsk' ? inRange.filter(c=>isNew.has(c.id)) : [];
    pick = [].concat(retry, second, fresh, allNew, oldPend, wrongAll);
  } else {
    // 오늘 이미 푼 개수를 빼고 계산 → 같은 날 범위를 바꿔도 오늘 새 분량이 늘지 않아요
    const freshQ = Math.max(0, Math.ceil((fresh.length+newToday)/Math.max(1,D-1)) - newToday);
    const oldQ = Math.max(0, Math.ceil((oldPend.length+oldToday)/D) - oldToday);
    if(deck==='hsk'){
      // 한자 새 분량: 이미 배운 건 맞혀도 매일 나오고, 안 배운 건 하루 몇 개씩 순서대로 들어와요
      pick = [].concat(retry, introduced, m2TakeChunk(deck, fresh, freshQ), m2TakeChunk(deck, oldPend, oldQ));
    } else {
      pick = [].concat(retry, second, m2TakeChunk(deck, fresh, freshQ), m2TakeChunk(deck, oldPend, oldQ));
    }
  }
  pick = pick.concat(todayDone);
  const seen = new Set(), ids = [];
  pick.forEach(c=>{ if(!seen.has(c.id)){ seen.add(c.id); ids.push(c.id); } });
  // 카드 원래 순서대로 정렬 (표현 그룹 순서 유지용)
  const order = new Map(deckCards.map((c,i)=>[c.id,i]));
  ids.sort((a,b)=>order.get(a)-order.get(b));
  return ids;
}
async function m2EnsurePlan(force){
  const [decks, s] = await Promise.all([loadAllDecks(), getSettings()]);
  const t = todayStr();
  const cycle = m2Cycle(s);
  const ranges = {}; for(const d of M2_DECKS) ranges[d] = await m2GetRange(d);
  const sig = 'p3|'+cycle+'|'+M2_DECKS.map(d=>{ const r=ranges[d]; return r?(r.cycle+':'+(r.new||[]).length+':'+(r.old||[]).length+':'+(r.at||'')):'-'; }).join('|');
  let plan = await sGet('m2-plan');
  // 지난 날 미션을 날짜별로 보관 (나중에 그날 것을 만회할 수 있게)
  const dayLog = (await sGet('m2-days')) || {};
  if(plan && plan.date && plan.date!==t && !dayLog[plan.date]){
    const dr = await sGet('m2-done');
    dayLog[plan.date] = {cycle:plan.cycle, decks:plan.decks, done:(dr && dr.date===plan.date) ? dr.keys : []};
    await sSet('m2-days', dayLog);
  }
  if(!(await sGet('m2-fix-midnight-1'))){
    // 한 번만: 자정 넘어 푼 어제 미션이 오늘 것으로 잘못 기록된 경우 정리
    const y = addDays(t,-1), dr = await sGet('m2-done');
    if(dayLog[y] && dr && dr.date===t){
      const yd = new Set(dayLog[y].done);
      dr.keys = dr.keys.filter(k=>!yd.has(k)); await sSet('m2-done', dr);
      if(dayLog[t]){ dayLog[t].done = dayLog[t].done.filter(k=>!yd.has(k)); await sSet('m2-days', dayLog); }
      force = true;
    }
    await sSet('m2-fix-midnight-1', true);
  }
  if(await sGet('m2-replan')){ force = true; await sSet('m2-replan', false); }
  if(!force && plan && plan.date===t && plan.sig===sig) return {plan, decks, s, ranges};
  const prog = await m2GetProg(cycle);
  const fixedAll = await sGet('m2-fixed');
  const dn = await m2GetDone();
  const doneToday = new Set(dn.date===t ? dn.keys : []);
  plan = {date:t, sig, cycle, decks:{}};
  for(const d of M2_DECKS){
    plan.decks[d] = m2LessonOk(s) ? m2BuildDeckPlan(d, decks[d], ranges[d], prog, s, doneToday, fixedAll) : null;
  }
  await sSet('m2-plan', plan);
  const dl = (await sGet('m2-days')) || {};
  dl[t] = {cycle, decks:plan.decks, done:(dl[t] && dl[t].done) || Array.from(doneToday)};
  await sSet('m2-days', dl);
  return {plan, decks, s, ranges};
}

/* 정답/오답 기록 */
async function m2Record(deck, id, good, makeDate){
  const s = await getSettings();
  const t = makeDate || todayStr();
  const prog = await m2GetProg(m2Cycle(s));
  const key = deck+':'+id;
  const e = prog.cards[key] || {};
  if(!e.first || t < e.first) e.first = t;
  const range = await m2GetRange(deck);
  const isNew = range && (range.new||[]).includes(id);
  if(good){
    const wrongToday = (e.wrong||[]).includes(t);
    if(!wrongToday){
      if(isNew){ e.days = Array.from(new Set((e.days||[]).concat([t]))); }
      else { e.cleared = true; }
    }
    if(e.lastWrongOpen && e.lastWrongOpen < t && !wrongToday){
      // 틀린 날 수만큼 서로 다른 날 연속으로 맞혀야 빠져요 (1번 → 1일, 2번 → 2일, 3번 이상 → 3일)
      e.okDays = Array.from(new Set((e.okDays||[]).concat([t])));
      const need = Math.min(3, (e.wrong||[]).length);
      if(e.okDays.length >= need){ e.lastWrongOpen = null; e.okDays = []; }
    }
    if(makeDate){ await m2MarkMadeUp(makeDate, key); }
    else {
      const done = await m2GetDone();
      if(!done.keys.includes(key)) done.keys.push(key);
      await sSet('m2-done', done);
      const dl = (await sGet('m2-days')) || {};
      if(dl[t]){ if(!dl[t].done.includes(key)) dl[t].done.push(key); await sSet('m2-days', dl); }
    }
  } else {
    e.wrong = Array.from(new Set((e.wrong||[]).concat([t])));
    if(!e.lastWrongOpen || e.lastWrongOpen < t) e.lastWrongOpen = t;       // 내일 한 번 더
    e.okDays = [];                                                         // 연속 정답 기록은 처음부터
  }
  prog.cards[key] = e;
  await sSet('m2-prog', prog);

/* ---- 지난 날 만회 ---- */
async function m2MarkMadeUp(ds, key){
  const dl = (await sGet('m2-days')) || {};
  const day = dl[ds]; if(!day) return;
  if(!day.done.includes(key)) day.done.push(key);
  await sSet('m2-days', dl);
  const all = M2_DECKS.every(d=>(day.decks[d]||[]).every(id=>day.done.includes(d+':'+id)));
  const hist = (await sGet('m2-hist')) || {};
  hist[ds] = {total:(hist[ds]&&hist[ds].total)||1, done:all};
  await sSet('m2-hist', hist);
  if(all){ const log = (await sGet('mission-completion-log')) || {}; log[ds] = true; await sSet('mission-completion-log', log); }
  await sSet('m2-replan', true);                                        // 오늘 미션을 다시 계산 (만회한 만큼 줄어요)
}
/* 만회할 날의 기록 찾기 — 과외 시간만 바꾼 경우(같은 날짜)도 인정하고, 기록이 없으면 이번 주 고정 배치에서 다시 만들어요 */
async function m2DayRecord(ds){
  const s = await getSettings();
  const cyc = m2Cycle(s), ld = cyc.slice(0,10);
  const dl = (await sGet('m2-days')) || {};
  let day = dl[ds];
  if(day && day.cycle && day.cycle.slice(0,10)===ld){ if(day.cycle!==cyc){ day.cycle = cyc; await sSet('m2-days', dl); } return day; }
  const fx = await sGet('m2-fixed');
  if(fx && fx.cycle && fx.cycle.slice(0,10)===ld){
    const prog = (await sGet('m2-prog')) || {cards:{}};
    const decks = {}, done = [];
    M2_DECKS.forEach(d=>{
      decks[d] = ((fx.decks||{})[d]||{})[ds] || [];
      decks[d].forEach(id=>{ const e = (prog.cards||{})[d+':'+id] || {}; if((e.days||[]).includes(ds) || e.first===ds) done.push(d+':'+id); });
    });
    if(M2_DECKS.some(d=>decks[d].length)){ day = {cycle:cyc, decks, done}; dl[ds] = day; await sSet('m2-days', dl); return day; }
  }
  return null;
}
async function m2OpenMakeup(ds){

    toast('만회 기록 없음 [v1022] '+ds+' / 과외 '+(s0.nextLesson||'-')+' / 배치 '+(fx&&fx.cycle||'-')+' / 기록 '+((dl[ds]&&dl[ds].cycle)||'-'));

async function m2StartMakeup(ds, deck){

  const decks = await loadAllDecks();
  const byId = new Map(decks[deck].map(c=>[c.id,c]));
  let list = (day.decks[deck]||[]).filter(id=>!day.done.includes(deck+':'+id)).map(id=>byId.get(id)).filter(Boolean).map(c=>({...c, _key:deck+':'+c.id}));

async function m2StartMission(deck){
  const {plan, decks, s, ranges} = await m2EnsurePlan();
  if(!m2LessonOk(s)){ m2OpenLesson(); return; }
  if(!ranges[deck] || ranges[deck].cycle!==m2Cycle(s)){ m2OpenRange(deck); return; }
  const done = new Set((await m2GetDone()).keys);
  const ids = (plan.decks[deck]||[]).filter(id=>!done.has(deck+':'+id));
  if(ids.length===0){
    if((plan.decks[deck]||[]).length===0){ toast(M2_NAME[deck]+' 오늘은 미션이 없어요'); return; }

  const byId = new Map(decks[deck].map(c=>[c.id,c]));
  let list = ids.map(id=>byId.get(id)).filter(Boolean).map(c=>({...c, _key:deck+':'+c.id}));
  list = deck==='expr' ? orderExprByGroup(list, decks[deck]) : shuffle(list);
  const starred = new Set(await getStarredKeys());
  review = {deck, queue:list, index:0, stage:'question', starred, mode:'m2', day:todayStr()};
  document.getElementById('reviewOverlay').classList.add('active');
  pushOverlayState();
  renderReviewStep();
}
