async function m2SaveLesson(){
  const d = document.getElementById('m2LessonDate').value;
  const tm = document.getElementById('m2LessonTime').value || '10:00';
  if(!d){ toast('날짜를 입력해주세요'); return; }
  if(d <= todayStr()){ toast('오늘 이후 날짜를 입력해주세요'); return; }
  const s = await getSettings();
  const oldCycle = s.nextLesson || '';
  s.nextLesson = d+'T'+tm;
  await setSettings(s);
  if(oldCycle && oldCycle.slice(0,10)===d && oldCycle!==s.nextLesson){
    // 같은 날짜에서 시간만 바꾼 경우: 이번 주 범위와 기록을 그대로 이어가요
    for(const dk of M2_DECKS){ const r = await m2GetRange(dk); if(r && r.cycle===oldCycle){ r.cycle = s.nextLesson; await sSet('m2-range-'+dk, r); } }
    const pg = await sGet('m2-prog'); if(pg && pg.cycle===oldCycle){ pg.cycle = s.nextLesson; await sSet('m2-prog', pg); }
    const fx = await sGet('m2-fixed'); if(fx && fx.cycle===oldCycle){ fx.cycle = s.nextLesson; await sSet('m2-fixed', fx); }
    const dl = (await sGet('m2-days')) || {}; Object.values(dl).forEach(v=>{ if(v && v.cycle===oldCycle) v.cycle = s.nextLesson; }); await sSet('m2-days', dl);
  }
  await sSet('m2-plan', null);
  closeModal();
  toast('다음 과외를 저장했어요. 카드마다 이번 주 범위를 정해주세요');
  renderHome();
}

/* ---- 일일 미션 범위 고르기 ---- */
function m2GroupOf(deck, c, idx){
  if(deck==='hsk') return {k:'L'+c.level, label:c.level+'급'};
  if(deck==='expr') return {k:'B'+c.book+'-'+c.lesson, label:c.book+'권 '+c.lesson+'과'};
  const b = Math.floor(idx/50); return {k:'V'+b, label:(b*50+1)+'~'+(b*50+50)+'번'};
}
async function m2OpenRange(deck){
  const [cards, s, prev] = await Promise.all([loadDeck(DECK_KEY[deck]), getSettings(), m2GetRange(deck)]);
  if(!m2LessonOk(s)){ m2OpenLesson(); return; }
  let sel;
  if(prev && prev.cycle===m2Cycle(s)) sel = {new:new Set(prev.new||[]), old:new Set(prev.old||[])};
  else if(prev) sel = {new:new Set(), old:new Set([].concat(prev.old||[], prev.new||[]))};   // 지난 주기 '새 분량'은 이번엔 복습 쪽으로
  else sel = {new:new Set(), old:new Set()};
  const items = cards.map((c,i)=>({c, i, g:m2GroupOf(deck,c,i)}));
  const groups = []; const gmap = {};
  items.forEach(it=>{ if(!gmap[it.g.k]){ gmap[it.g.k]={k:it.g.k,label:it.g.label,items:[]}; groups.push(gmap[it.g.k]); } gmap[it.g.k].items.push(it); });
  window._m2r = {deck, cards, sel, tab:'new', groups, open:new Set(), carried: !!(prev && prev.cycle!==m2Cycle(s))};
  m2RenderRange();
  document.getElementById('modalBg').classList.add('active');
  pushOverlayState();
}

  if(deck==='vocab') return `<span style="color:var(--ink-soft);font-size:12px;min-width:30px;display:inline-block;">${it.i+1}.</span><span style="font-size:13px;">${esc(c.py)}</span> <span class="sub">${esc(c.ko)}</span>`;

}

       <input type="number" id="m2rFrom" placeholder="시작" inputmode="numeric" style="width:64px;"><span class="sub">~</span><input type="number" id="m2rTo" placeholder="끝" inputmode="numeric" style="width:64px;">`

function m2Tab(t){ window._m2r.tab = t; m2RenderRange(); }
function m2OpenGroup(k){ const o=window._m2r.open; o.has(k)?o.delete(k):o.add(k); m2RenderRange(); }
function m2ToggleItem(id, on){ const R=window._m2r; on?R.sel[R.tab].add(id):R.sel[R.tab].delete(id); m2RenderRange(); }
function m2ToggleGroup(k, on){
  const R=window._m2r, other=R.sel[R.tab==='new'?'old':'new'];
  R.groups.find(g=>g.k===k).items.forEach(it=>{ if(other.has(it.c.id)) return; on?R.sel[R.tab].add(it.c.id):R.sel[R.tab].delete(it.c.id); });
  m2RenderRange();
}
function m2ClearTab(){ const R=window._m2r; R.sel[R.tab].clear(); m2RenderRange(); }
function m2AddRange(){
  const R=window._m2r, deck=R.deck, other=R.sel[R.tab==='new'?'old':'new'];
  let hit = [];
  const v = id=>document.getElementById(id).value;
  if(deck==='hsk'){
    const lv=v('m2rLv'), f=Number(v('m2rFrom')), to=Number(v('m2rTo'));
    if(!f||!to||f>to){ toast('번호를 확인해주세요'); return; }
    hit = R.cards.filter(c=>String(c.level)===lv && Number(c.no)>=f && Number(c.no)<=to);
  } else if(deck==='vocab'){
    const f=Number(v('m2rFrom')), to=Number(v('m2rTo'));
    if(!f||!to||f>to){ toast('번호를 확인해주세요'); return; }
    hit = R.cards.filter((c,i)=>i+1>=f && i+1<=to);
  } else {
    const fb=v('m2rFB'), fl=v('m2rFL'), tb=v('m2rTB'), tl=v('m2rTL');
    if(fb===''||fl===''||tb===''||tl===''){ toast('권/과를 모두 입력해주세요'); return; }
    const from=Number(fb)*1000+Number(fl), to=Number(tb)*1000+Number(tl);
    hit = R.cards.filter(c=>{ const k=(Number(c.book)||0)*1000+(Number(c.lesson)||0); return k>=from && k<=to; });
  }
  hit = hit.filter(c=>!other.has(c.id));
  if(hit.length===0){ toast('해당 범위에 추가할 게 없어요'); return; }
  hit.forEach(c=>R.sel[R.tab].add(c.id));
  toast(hit.length+'개를 '+(R.tab==='new'?'새 분량':'예전 복습')+'에 넣었어요');
  m2RenderRange();
}
async function m2SaveRange(){

  const W = ['일','월','화','수','목','금','토'];

    <div class="sub" style="margin-bottom:10px;">새로 넣은 ${added.length}개를 일일 미션에 언제부터 넣을지 골라주세요. 고른 날부터 과외 전날까지 나눠서 나와요.</div>
    <div class="hstack" style="flex-wrap:wrap;gap:6px;">
      ${days.map((d,i)=>{ const dt=new Date(d+'T00:00:00'); const lb = i===0?'오늘':(i===1?'내일':''); return `<button class="${i===0?'primary':'ghost'} small" style="min-width:64px;" onclick="m2CommitRange('${d}')">${lb?lb+'<br>':''}${dt.getMonth()+1}/${dt.getDate()}(${W[dt.getDay()]})</button>`; }).join('')}
    </div>
    <button class="ghost" style="width:100%;margin-top:12px;" onclick="m2RenderRange()">← 범위로 돌아가기</button>`;
}
async function m2CommitRange(startDate){
  const R = window._m2r, s = await getSettings();
  const keep = new Set([...R.sel.new, ...R.sel.old]);
  const start = {};
  Object.entries(R.prevStart||{}).forEach(([id,d])=>{ if(keep.has(id)) start[id]=d; });
  if(startDate > todayStr()) (R.added||[]).forEach(id=>{ start[id] = startDate; });
  await sSet('m2-range-'+R.deck, {cycle:m2Cycle(s), new:[...R.sel.new], old:[...R.sel.old], start, at:Date.now()});
  closeModal();
  await m2EnsurePlan();
  const dt = new Date(startDate+'T00:00:00');
  toast(M2_NAME[R.deck]+' 범위를 저장했어요 — '+(startDate===todayStr()?'오늘부터':(dt.getMonth()+1)+'/'+dt.getDate()+'부터')+' 일일 미션에 나와요');
  renderHome();
}

/* ---- 다시하기 (복습 시작 / 즐겨찾기) ---- */
function m2OpenResetChooser(deck){
  document.getElementById('modalContent').innerHTML = `
    <h3>${M2_NAME[deck]} 다시하기</h3>
    <div class="sub" style="margin-bottom:10px;">다 맞혀서 끝난 걸 처음부터 다시 돌려요. 일일 미션 다시 하기는 오늘 분량을 연습으로 한 번 더 풀어요(기록은 그대로).</div>
    <button class="ghost" style="width:100%;margin-bottom:8px;" onclick="openResetProgressConfirm('${deck}')">'복습 시작' 다시하기</button>
    <button class="ghost" style="width:100%;margin-bottom:8px;" onclick="openResetStarredConfirm('${deck}')">'즐겨찾기' 다시하기</button>
    <button class="ghost" style="width:100%;margin-bottom:8px;" onclick="closeModal();setTimeout(()=>m2Redo('${deck}'),50)">오늘 '일일 미션' 다시 하기</button>
    <button class="ghost" style="width:100%;" onclick="closeModal()">닫기</button>`;
  document.getElementById('modalBg').classList.add('active');
  pushOverlayState();
}

/* ---- 홈 ---- */
async function renderHome(){
  const el = document.getElementById('view-home');
  const {plan, s, ranges} = await m2EnsurePlan();
  const t = todayStr();
  const done = new Set((await m2GetDone()).keys);
  const lessonOk = m2LessonOk(s);
  const st = {};
  let total = 0, left = 0;
  M2_DECKS.forEach(d=>{
    const ids = plan.decks[d];
    if(ids==null){ st[d] = {set:false}; return; }
    const l = ids.filter(id=>!done.has(d+':'+id)).length;
    st[d] = {set:true, total:ids.length, left:l};
    total += ids.length; left += l;
  });
  // 날짜별 기록
  const hist = (await sGet('m2-hist')) || {};
  if(lessonOk){ hist[t] = {total, done: total>0 && left===0}; await sSet('m2-hist', hist); }
  let log = (await sGet('mission-completion-log')) || {};
  if(total>0 && left===0 && !log[t]){ log[t] = true; await sSet('mission-completion-log', log); }
  const streak = computeStreak(log, wd=>false);
  const streakEl = document.getElementById('streakDisplay');
  if(streakEl) streakEl.textContent = '🔥'+streak+'일 연속 성공 중';

  const monday = getMondayDateStr(new Date());
  const week = MISSION_DAYS.map((lb,i)=>{
    const ds = addDays(monday, i), h = hist[ds];
    let mark = '', bg = 'var(--paper-2)', col = 'var(--ink-soft)', bd = '1px solid var(--line)';
    if(ds===t){ mark = (h&&h.done)?'✓':'●'; if(h&&h.done){ bg='var(--jade)'; col='#fff'; } else { bd='2px solid var(--seal)'; col='var(--seal)'; } }
    else if(ds<t){ if(h&&h.done){ mark='✓'; bg='var(--jade)'; col='#fff'; } else if(h&&h.total>0){ mark='✗'; bg='#FCE9E9'; col='var(--seal)'; } else { mark='–'; } }
    else { bd='1px dashed var(--line)'; }
    const canMake = ds<t && h && h.total>0 && !h.done;
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;${canMake?'cursor:pointer;':''}" ${canMake?`onclick="m2OpenMakeup('${ds}')"`:''}><span style="font-size:11px;color:${ds===t?'var(--seal)':'var(--ink-soft)'};font-weight:${ds===t?700:400};">${lb}</span>
      <div style="width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;background:${bg};color:${col};border:${bd};">${mark}</div></div>`;
  }).join('');

  const y = hist[addDays(t,-1)];
  const missed = lessonOk && y && y.total>0 && !y.done;
  const unset = M2_DECKS.filter(d=>!st[d].set);
  const todayLine = M2_DECKS.map(d=>{
    const x = st[d];
    const txt = !x.set ? '<span class="sub">범위 미설정</span>' : (x.total===0 ? '<span class="sub">오늘 없음</span>' : (x.left===0 ? '<b style="color:var(--jade);">✓</b>' : `<b style="color:var(--seal);">${x.left}개</b> 남음`));
    return `<div style="flex:1;text-align:center;font-size:13px;">${M2_ICON[d]} ${M2_NAME[d]}<div style="margin-top:2px;">${txt}</div></div>`;
  }).join('');
  const allDone = lessonOk && total>0 && left===0;

  const top = !lessonOk ? `
    <div class="card" style="border-left:5px solid var(--seal);">
      <div style="font-weight:700;color:var(--seal);margin-bottom:6px;">🚨 다음 과외 날짜를 입력하세요</div>
      <div class="sub" style="margin-bottom:10px;">${s.nextLesson?'입력된 과외 시간이 지났어요. ':''}날짜를 입력해야 일일 미션이 만들어져요.</div>
      <button class="primary" style="width:100%;" onclick="m2OpenLesson()">과외 날짜 입력</button>
    </div>` : `
    <div class="card">
      <div class="row-between" style="align-items:center;">
        <div><b style="font-size:16px;">과외까지 ${diffDays(t, m2LessonDate(s))}일</b> <span class="sub">${esc(m2FmtLesson(s))}</span></div>
        <button class="ghost small" style="padding:3px 8px;" onclick="m2OpenLesson()">✏️</button>
      </div>
      <div style="margin:12px 0 4px;font-weight:700;font-size:13.5px;">오늘</div>
      ${allDone ? `<div style="background:#E8F3EC;color:var(--jade);font-weight:700;text-align:center;padding:10px;border-radius:8px;">🎉 오늘 완료! 이대로만 하면 돼요</div>`
                : `<div class="hstack">${todayLine}</div>`}
      <div class="hstack" style="justify-content:space-between;margin-top:12px;">${week}</div>
      ${missed?`<div class="sub" style="margin-top:8px;color:var(--seal);">⚠️ 어제 미션이 빠져서, 남은 날 하루 양이 조금 늘었어요. ✗를 누르면 그날 것을 만회할 수 있어요.</div>`:''}
      ${unset.length?`<div class="sub" style="margin-top:8px;color:var(--seal);">⚠️ ${unset.map(d=>M2_NAME[d]).join('·')} 범위를 아직 안 정했어요 — 카드의 '일일 미션'을 눌러 정해주세요.</div>`:''}
      ${lessonOk && t>=m2Eve(s)?`<div class="sub" style="margin-top:8px;">📝 오늘은 과외 전날이에요. 남은 것과 이번 주에 틀렸던 것이 모두 나와요.</div>`:''}
    </div>`;

  const card = d=>{
    const x = st[d], r = ranges[d];
    const sub = !lessonOk ? '과외 날짜를 먼저 입력하세요' : (!x.set ? '일일 미션 범위를 정해주세요' : (x.total===0 ? '오늘 미션 없음' : (x.left===0 ? '오늘 미션 완료 ✓' : `오늘 미션 ${x.left}개 남음`)));
    const startFree = d==='hsk' ? 'openReviewScope()' : (d==='expr' ? 'openExprScope()' : "startReview('vocab')");
    return `<div class="card">
      <div class="row-between" style="align-items:center;">
        <div><h3 style="margin:0;">${M2_ICON[d]} ${M2_NAME[d]}</h3><div class="sub" style="${x.set&&x.left>0?'color:var(--seal);':''}">${sub}</div></div>
        ${x.set?`<a href="#" class="sub" onclick="m2OpenRange('${d}');return false;" style="text-decoration:underline;">범위 (새 ${(r.new||[]).length} · 복습 ${(r.old||[]).length})</a>`:''}
      </div>
      <div class="hstack" style="margin-top:10px;gap:6px;">
        <button class="ghost small" style="flex:1;padding:8px 2px;" onclick="${startFree}">복습 시작</button>
        <button class="ghost small" style="flex:1;padding:8px 2px;" onclick="m2OpenResetChooser('${d}')">다시하기</button>
        <button class="ghost small" style="flex:1;padding:8px 2px;" onclick="reviewStarred('${d}')">즐겨찾기</button>
        <button class="primary small" style="flex:1;padding:8px 2px;" onclick="m2StartMission('${d}')">일일 미션</button>
      </div>
    </div>`;
  };
  el.innerHTML = top + M2_DECKS.map(card).join('') + `
    <button class="ghost" style="width:100%;margin-top:4px;" onclick="m2OpenLesson()">📅 과외 날짜 설정</button>
    <div class="sub" style="text-align:center;margin-top:10px;font-size:11px;">버전 10.22</div>`;
}

/* ---------------- init ---------------- */
(async function init(){
  await ensureSeed();
  await syncHsk3V1();
  await srsInitV1();
  await m2PresetW1019();
  await renderHome();
  const s0 = await getSettings();
  if(!m2LessonOk(s0)) m2OpenLesson();   // 과외 날짜가 없거나 지났으면 바로 입력 창
})();
</script>
