/* ---- 홈 ---- */
async function renderHome(){
  const el = document.getElementById('view-home');
  const {plan, s, ranges} = await m2EnsurePlan();
  const t = todayStr();
  const done = new Set((await m2GetDone()).keys);
  const lessonOk = m2LessonOk(s);
  const st = {};
  let total = 0, left = 0;
  M2_DECKS.forEach(d=>{
    const ids = plan.decks[d];
    if(ids==null){ st[d] = {set:false}; return; }
    const l = ids.filter(id=>!done.has(d+':'+id)).length;
    st[d] = {set:true, total:ids.length, left:l};
    total += ids.length; left += l;
  });
  // 날짜별 기록
  const hist = (await sGet('m2-hist')) || {};
  if(lessonOk){ hist[t] = {total, done: total>0 && left===0}; await sSet('m2-hist', hist); }
  let log = (await sGet('mission-completion-log')) || {};
  if(total>0 && left===0 && !log[t]){ log[t] = true; await sSet('mission-completion-log', log); }
  const streak = computeStreak(log, wd=>false);
  const streakEl = document.getElementById('streakDisplay');
  if(streakEl){ const dd = diffDays(todayStr(), HSK_EXAM_DATE); streakEl.textContent = '📝 HSK 시험 '+(dd>0?'D-'+dd:(dd===0?'D-Day':'D+'+(-dd))); }

  const monday = getMondayDateStr(new Date());
  // 앱을 아예 안 연 날도 그날 미션을 다시 계산해서 ✗·만회가 되게
  if(lessonOk){ await m2BackfillDays(s, ranges); Object.assign(hist, (await sGet('m2-hist')) || {}); }
  // 이번 과외 주기에 속한 날만 ✗(못 한 날)로 보여줘요 — 지난 주기의 날은 '–'
  const dayLog = (await sGet('m2-days')) || {};
  const curLD = lessonOk ? m2LessonDate(s) : null;
  const dstr = ms=>{ const d=new Date(ms); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
  const startDays = M2_DECKS.map(d=>ranges[d]).filter(r=>r && r.cycle===m2Cycle(s) && r.at).map(r=>dstr(r.at));
  const cycleStart = startDays.length ? startDays.sort()[0] : t;   // 이번 주기 범위를 처음 정한 날
  const inCycle = ds=>!!(curLD && ds>=cycleStart && dayLog[ds] && dayLog[ds].cycle && dayLog[ds].cycle.slice(0,10)===curLD);
  // 요일 줄: 이번 과외 주기(범위 정한 날 ~ 과외 전날)를 보여줘요 (최대 7일)
  const WK = ['일','월','화','수','목','금','토'];
  let rowDays = [];
  if(lessonOk){ const eve = m2Eve(s); let from = cycleStart; if(diffDays(from, eve) > 6) from = addDays(eve, -6); for(let d=from; d<=eve; d=addDays(d,1)) rowDays.push(d); }
  if(!rowDays.length) rowDays = MISSION_DAYS.map((_,i)=>addDays(monday,i));
  const week = rowDays.map(ds=>{
    const lb = WK[new Date(ds+'T00:00:00').getDay()], h = hist[ds];
    let mark = '', bg = 'var(--paper-2)', col = 'var(--ink-soft)', bd = '1px solid var(--line)';
    if(ds===t){ mark = (h&&h.done)?'✓':'●'; if(h&&h.done){ bg='var(--jade)'; col='#fff'; } else { bd='2px solid var(--seal)'; col='var(--seal)'; } }
    else if(ds<t && ds<cycleStart){ mark='–'; }   // 이번 주기 시작 전 날은 비워 둬요
    else if(ds<t){ if(h&&h.done){ mark='✓'; bg='var(--jade)'; col='#fff'; } else if(h&&h.total>0&&inCycle(ds)){ mark='✗'; bg='#FCE9E9'; col='var(--seal)'; } else { mark='–'; } }
    else { bd='1px dashed var(--line)'; }
    const canMake = ds<t && h && h.total>0 && !h.done && inCycle(ds);
    const canRedo = ds<t && ds>=cycleStart && h && h.done && inCycle(ds);
    const click = canMake ? `m2OpenMakeup('${ds}')` : (canRedo ? `m2OpenPastRedo('${ds}')` : '');
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;${click?'cursor:pointer;':''}" ${click?`onclick="${click}"`:''}><span style="font-size:11px;color:${ds===t?'var(--seal)':'var(--ink-soft)'};font-weight:${ds===t?700:400};">${lb}</span>
      <div style="width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;background:${bg};color:${col};border:${bd};">${mark}</div></div>`;
  }).join('');

  const y = hist[addDays(t,-1)];
  const missed = lessonOk && y && y.total>0 && !y.done && inCycle(addDays(t,-1));
  const unset = M2_DECKS.filter(d=>!st[d].set);
  const todayLine = M2_DECKS.map(d=>{
    const x = st[d];
    const txt = !x.set ? '<span class="sub">범위 미설정</span>' : (x.total===0 ? '<span class="sub">오늘 없음</span>' : (x.left===0 ? '<b style="color:var(--jade);">✓</b>' : `<b style="color:var(--seal);">${x.left}개</b> 남음`));
    return `<div style="flex:1;text-align:center;font-size:13px;">${M2_ICON[d]} ${M2_NAME[d]}<div style="margin-top:2px;">${txt}</div></div>`;
  }).join('');
  const allDone = lessonOk && total>0 && left===0;

  const top = !lessonOk ? `
    <div class="card" style="border-left:5px solid var(--seal);">
      <div style="font-weight:700;color:var(--seal);margin-bottom:6px;">🚨 다음 과외 날짜를 입력하세요</div>
      <div class="sub" style="margin-bottom:10px;">${s.nextLesson?'입력된 과외 시간이 지났어요. ':''}날짜를 입력해야 일일 미션이 만들어져요.</div>
      <button class="primary" style="width:100%;" onclick="m2OpenLesson()">과외 날짜 입력</button>
    </div>` : `
    <div class="card">
      <div class="row-between" style="align-items:center;">
        <div><b style="font-size:16px;">과외까지 ${diffDays(t, m2LessonDate(s))}일</b> <span class="sub">${esc(m2FmtLesson(s))}</span></div>
        <button class="ghost small" style="padding:3px 8px;" onclick="m2OpenLesson()">✏️</button>
      </div>
      <div style="margin:12px 0 4px;font-weight:700;font-size:13.5px;">오늘</div>
      ${allDone ? `<div style="background:#E8F3EC;color:var(--jade);font-weight:700;text-align:center;padding:10px;border-radius:8px;">🎉 오늘 완료! 이대로만 하면 돼요</div>`
                : `<div class="hstack">${todayLine}</div>`}
      <div class="hstack" style="justify-content:space-between;margin-top:12px;">${week}</div>
      ${missed?`<div class="sub" style="margin-top:8px;color:var(--seal);">⚠️ 어제 미션이 빠져서, 남은 날 하루 양이 조금 늘었어요. ✗를 누르면 그날 것을 만회할 수 있어요.</div>`:''}
      ${unset.length?`<div class="sub" style="margin-top:8px;color:var(--seal);">⚠️ ${unset.map(d=>M2_NAME[d]).join('·')} 범위를 아직 안 정했어요 — 카드의 '일일 미션'을 눌러 정해주세요.</div>`:''}
      ${lessonOk && t>=m2Eve(s)?`<div class="sub" style="margin-top:8px;">📝 오늘은 과외 전날이에요. 남은 것과 이번 주에 틀렸던 것이 모두 나와요.</div>`:''}
    </div>`;

  const card = d=>{
    const x = st[d], r = ranges[d];
    const sub = !lessonOk ? '과외 날짜를 먼저 입력하세요' : (!x.set ? '일일 미션 범위를 정해주세요' : (x.total===0 ? '오늘 미션 없음' : (x.left===0 ? '오늘 미션 완료 ✓' : `오늘 미션 ${x.left}개 남음`)));
    const startFree = d==='hsk' ? 'openReviewScope()' : (d==='expr' ? 'openExprScope()' : "startReview('vocab')");
    return `<div class="card">
      <div class="row-between" style="align-items:center;">
        <div><h3 style="margin:0;">${M2_ICON[d]} ${M2_NAME[d]}</h3><div class="sub" style="${x.set&&x.left>0?'color:var(--seal);':''}">${sub}</div></div>
        ${x.set?`<a href="#" class="sub" onclick="m2OpenRange('${d}');return false;" style="text-decoration:underline;">범위 (새 ${(r.new||[]).length} · 복습 ${(r.old||[]).length})</a>`:''}
      </div>
      <div class="hstack" style="margin-top:10px;gap:6px;">
        <button class="ghost small" style="flex:1;padding:8px 2px;" onclick="${startFree}">복습 시작</button>
        <button class="ghost small" style="flex:1;padding:8px 2px;" onclick="m2OpenResetChooser('${d}')">다시하기</button>
        <button class="ghost small" style="flex:1;padding:8px 2px;" onclick="reviewStarred('${d}')">즐겨찾기</button>
        <button class="primary small" style="flex:1;padding:8px 2px;" onclick="m2StartMission('${d}')">일일 미션</button>
      </div>
    </div>`;
  };
  const v3html = await v3HomeHTML();
  const fo = v3FoldOpen();
  el.innerHTML = v3html + `
    <div onclick="v3ToggleFold()" style="cursor:pointer;background:var(--paper-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:4px 0 10px;font-weight:700;font-size:14px;">
      <span id="tutorFoldArrow">${fo?'▾':'▸'}</span> 과외 복습 <span class="sub" style="font-weight:400;">한자 · 단어 · 표현</span></div>
    <div id="tutorFold" style="${fo?'':'display:none;'}">` + top + M2_DECKS.map(card).join('') + `
    <button class="ghost" style="width:100%;margin-top:4px;" onclick="m2OpenLesson()">📅 과외 날짜 설정</button></div>
    <div class="sub" style="text-align:center;margin-top:10px;font-size:11px;">버전 11.06-4</div>`;
}

/* =====================================================================
   HSK 3.0 어휘 (학원) — 2026-11-03 추가
   - 1·2급(1~500, 웹 공식 목록) + 3급(501~1000, 학원 PDF)
   - 한자를 보고 병음·뜻을 떠올린 뒤 정답을 보고 스스로 채점
   - 일일 미션: 3급 새 50 + 3급 어제 50 다시 + 1·2급 새 50 (+ 틀린 것)
   ===================================================================== */
const V3_START = '2026-11-03';

function v3PosKey(tag){ return (tag==='접두'||tag==='접미') ? '접사' : tag; }
function v3PosSegs(ko){
  const out = []; const re = /\[([^\]]+)\]\s*([^\[]*)/g; let m;
  while((m = re.exec(ko))) out.push({key:v3PosKey(m[1]), tag:m[1], text:m[2].trim()});
  return out;
}
function v3PosKeys(card){ return Array.from(new Set(v3PosSegs(card.ko).map(x=>x.key))); }

  else { review.posSel.push(k); review.posSel.sort((a,b)=>V3_POS.findIndex(x=>x[0]===a)-V3_POS.findIndex(x=>x[0]===b)); }

function v3TypedHTML(card){
  const tp = review.typedPinyin||'', sel = review.posSel||[], vals = review.posVals||{};
  if(!tp && !sel.length) return '';
  const all = [card].concat(v3Others(card).map(v3Card));
  let mark = '';
  const G = '<span style="color:var(--jade);font-weight:700;">✓</span>', R = '<span style="color:var(--seal);font-weight:700;">✗</span>';
  const findAll = (fn)=>{ let rest = fn(tp); let hit = 0;
    all.map(c=>fn(c.py)).sort((a,b)=>b.length-a.length).forEach(k=>{ const i = rest.indexOf(k); if(i>=0){ hit++; rest = rest.slice(0,i)+'|'+rest.slice(i+k.length); } });
    return hit; };
  if(tp){
    if(all.length===1){
      if(v3PyKey(card.py)===v3PyKey(tp)) mark = G;
      else if(v3PyBase(card.py)===v3PyBase(tp)) mark = '<span style="color:var(--gold);font-weight:700;">△ 성조 확인</span>';
      else mark = R;
    } else {
      const ex = findAll(v3PyKey), bs = findAll(v3PyBase);
      if(ex===all.length) mark = G;
      else if(bs===all.length) mark = '<span style="color:var(--gold);font-weight:700;">△ 성조 확인</span>';
      else if(ex>0) mark = `<span style="color:var(--gold);font-weight:700;">△ ${all.length}개 중 ${ex}개</span>`;
      else mark = R;
    }
  }
  const okPos = new Set(all.flatMap(c=>v3PosKeys(c)));
  return `<div style="background:var(--paper-2);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:14px;line-height:1.6;">
    <div class="sub" style="font-size:12px;">내가 쓴 답</div>
    <div>병음: ${tp?esc(tp):'<span class="sub">(안 씀)</span>'} ${mark}</div>
    ${sel.map(k=>`<div><span class="sub" style="font-size:13px;">[${esc(V3_POS_NAME[k])}]</span> ${vals[k]&&vals[k].trim()?esc(vals[k].trim()):'<span class="sub">(안 씀)</span>'} ${okPos.has(k)?G:R}</div>`).join('')}
    ${sel.length ? V3_POS.map(p=>p[0]).filter(k=>okPos.has(k)&&!sel.includes(k)).map(k=>`<div><span class="sub" style="font-size:13px;">[${esc(V3_POS_NAME[k])}]</span> <span class="sub">—</span> ${R}</div>`).join('') : ''}</div>`;
}
/* 한자별 훈음 줄 (예: 安 편안 안 · 静(靜) 고요할 정) */
function v3HunHTML(han){
  const cust = (review && review.hunCustom) || {};
  const parts = [];
  for(const ch of String(han)){
    if(!/[\u4e00-\u9fff]/.test(ch)) continue;
    if(parts.some(p=>p.ch===ch)) continue;
    const base = HANZI_HUN[ch] || ['',''];
    const text = (cust[ch]!=null && cust[ch]!=='') ? cust[ch] : base[1];
    parts.push({ch, trad:base[0], text});
  }
  if(!parts.length) return '';
  return `<div style="text-align:center;font-size:14px;margin-top:6px;line-height:1.7;">${parts.map(p=>`<span style="white-space:nowrap;"><b class="hanzi">${esc(p.ch)}</b>${p.trad?`<span class="sub">(${esc(p.trad)})</span>`:''} ${p.text?esc(p.text):'<span class="sub">?</span>'}</span>`).join(' <span class="sub">·</span> ')}</div>`;
}
function v3Others(card){ return (V3_SAME.get(card.han)||[]).filter(n=>n!==card.no); }
function v3DayIdx(d){ return diffDays(V3_START, d); }
function v3Range(a, b){ const o=[]; for(let i=a;i<=b;i++) o.push(i); return o; }
/* 그날의 고정 분량 (틀린 것 제외) */
/* 학원 진도표 (3급) — 시험 전날엔 그 50개, 나머지 날엔 다음 50개를 미리, 새 단어가 다 끝나면 3급 섞어서 50개
   11/27 마지막 수업 · 951~1000은 시험 없이 혼자 */
const V3_CLASS_TESTS = [['2026-11-05',501],['2026-11-10',551],['2026-11-12',601],['2026-11-13',651],['2026-11-17',701],['2026-11-19',751],['2026-11-24',801],['2026-11-26',851],['2026-11-27',901]];
const V3_P3_END = 24;      // 11/27까지 3급 진도
const V3_N12_DAYS = 10;    // 11/3~11/12 1·2급 새 단어 50개씩
const V3_ROUNDS = [{from:25, days:14, seed:3}];   // 11/28~12/11 1~1000 전체 섞어서
const V3_EVE_IDX = 39;     // 12/12
function v3PreTest(d){ const t = addDays(d,1); const h = V3_CLASS_TESTS.find(x=>x[0]===t); return h ? {date:t, from:h[1]} : null; }
function v3SeededShuffle(arr, seed){
  const a = arr.slice(); let x = seed*9301+49297;
  for(let i=a.length-1;i>0;i--){ x = (x*9301+49297) % 233280; const j = Math.floor(x/233280*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function v3Slice(arr, seed, i, n){ const sh = v3SeededShuffle(arr, seed); return sh.slice(Math.round(arr.length*i/n), Math.round(arr.length*(i+1)/n)); }
let _v3Sched = null;
function v3Sched3(){
  if(_v3Sched) return _v3Sched;
  const days = []; let next = 501;
  for(let k=0;k<=V3_P3_END;k++){
    const d = addDays(V3_START, k), pt = v3PreTest(d);
    if(pt) days.push({kind:'pre', from:pt.from, test:pt.date});
    else if(next<=951){ days.push({kind:'new', from:next}); next += 50; }
    else days.push({kind:'mix'});
  }
  const mixK = days.map((x,k)=>x.kind==='mix'?k:-1).filter(k=>k>=0);
  const mixAll = v3SeededShuffle(v3Range(501,1000), 11);
  mixK.forEach((k,i)=>{ const st = (50*i)%500; days[k].ids = mixAll.slice(st, st+50); });
  return (_v3Sched = days);
}
function v3RoundSlice(k){
  for(const r of V3_ROUNDS){
    if(k>=r.from && k<r.from+r.days){
      const i = k-r.from, n = r.days;
      return {round:2, day:i+1, days:n, ids: [].concat(v3Slice(v3Range(501,1000), r.seed*7+501, i, n), v3Slice(v3Range(1,500), r.seed*7+1, i, n))};
    }
  }
  return null;
}
function v3Fixed(d){
  const k = v3DayIdx(d);
  const parts = {rep3:[], new3:[], pre:[], mix3:[], new12:[], rev12:[], rev:[], s3:null};
  if(k>=0 && k<=V3_P3_END){
    const s3 = v3Sched3()[k]; parts.s3 = s3;
    if(s3.kind==='new') parts.new3 = v3Range(s3.from, s3.from+49);
    else if(s3.kind==='pre') parts.pre = v3Range(s3.from, s3.from+49);
    else parts.mix3 = s3.ids;
  }
  if(k>=0 && k<V3_N12_DAYS) parts.new12 = v3Range(1+50*k, 50+50*k);
  else if(k>=V3_N12_DAYS && k<=V3_P3_END) parts.rev12 = v3Slice(v3Range(1,500), 12, k-V3_N12_DAYS, V3_P3_END-V3_N12_DAYS+1);
  const rs = v3RoundSlice(k); if(rs) parts.rev = rs.ids;
  return parts;
}
async function v3GetProg(){ return (await sGet('v3-prog')) || {cards:{}}; }
async function v3GetDoneMap(){ return (await sGet('v3-done')) || {}; }
/* 오늘 다시 나올 틀린 것: 마지막으로 틀린 날이 오늘보다 앞이고 아직 다시 맞히지 않은 것 */
function v3RetryIds(prog, d){
  return Object.entries(prog.cards).filter(([no,e])=>e.lastWrongOpen && e.lastWrongOpen < d).map(([no])=>Number(no)).sort((a,b)=>a-b);
}
/* 그날 미션 전체 (순서: 틀린 것 → 3급 어제 → 3급 오늘 → 1·2급) */
async function v3Plan(d, prog){
  prog = prog || await v3GetProg();
  const f = v3Fixed(d);
  const retry = d===todayStr() ? v3RetryIds(prog, d) : ((await sGet('v3-retry-snap')) || {})[d] || [];
  let eve = [];
  if(v3DayIdx(d)===V3_EVE_IDX){
    const wrongEver = Object.entries(prog.cards).filter(([no,e])=>(e.wrong||[]).length).map(([no])=>Number(no));
    const star = (await getStarredKeys()).filter(k=>k.startsWith('v3:')).map(k=>Number(k.slice(3)));
    eve = Array.from(new Set(wrongEver.concat(star))).sort((a,b)=>a-b);
  }
  const seen = new Set(), out = [];
  [retry, f.pre, f.new3, f.mix3, f.new12, f.rev12, f.rev, eve].forEach(arr=>arr.forEach(n=>{ if(!seen.has(n)){ seen.add(n); out.push(n); } }));
  return {ids:out, retry, eve, ...f};
}
async function v3Record(no, good, d){
  d = d || todayStr();
  const prog = await v3GetProg();
  const e = prog.cards[no] || {};
  if(good){
    const wrongThatDay = (e.wrong||[]).includes(d);
    if(!wrongThatDay){
      e.days = Array.from(new Set((e.days||[]).concat([d])));
      if(e.lastWrongOpen && e.lastWrongOpen < d) e.lastWrongOpen = null;   // 다른 날 다시 맞히면 '틀린 것'에서 빠져요
    }
    const dm = await v3GetDoneMap();
    dm[d] = Array.from(new Set((dm[d]||[]).concat([Number(no)])));
    await sSet('v3-done', dm);
  } else {
    e.wrong = Array.from(new Set((e.wrong||[]).concat([d])));
    if(!e.lastWrongOpen || e.lastWrongOpen < d) e.lastWrongOpen = d;
  }
  prog.cards[no] = e;
  await sSet('v3-prog', prog);
}
/* 오늘의 틀린 것 목록을 날짜별로 남겨 둬요 (지난 날 만회·다시하기용) */
async function v3SnapRetry(t, retry){
  const snap = (await sGet('v3-retry-snap')) || {};
  if(!snap[t]){ snap[t] = retry; await sSet('v3-retry-snap', snap); }
}
function v3SessDay(){ return (review && review.day && review.day!==todayStr()) ? review.day : undefined; }

async function v3StartSession(nos, mode, extra){
  if(!nos.length){ toast('풀 문제가 없어요'); return; }
  const starred = new Set(await getStarredKeys());
  const hunCustom = await getCustomHun();
  const queue = nos.map(n=>({...v3Card(n)})).filter(c=>c.han);
  review = Object.assign({deck:'v3', queue, index:0, stage:'question', starred, mode, hunCustom}, extra||{});
  document.getElementById('reviewOverlay').classList.add('active');
  pushOverlayState();
  renderReviewStep();
}
function v3ShuffleParts(plan){
  // 무작위 대신 번호 순서대로
  const all = [].concat(plan.retry, plan.pre||[], plan.new3, plan.mix3||[], plan.new12, plan.rev12||[], plan.rev||[], plan.eve||[]);
  // 3급(501~) 먼저, 그다음 1·2급 — 각각 번호 순서
  return Array.from(new Set(all)).sort((a,b)=>((a>=501?0:1)-(b>=501?0:1)) || a-b);
}
async function v3StartMission(){
  const t = todayStr();
  const prog = await v3GetProg();
  const plan = await v3Plan(t, prog);
  await v3SnapRetry(t, plan.retry);
  const done = new Set((await v3GetDoneMap())[t] || []);
  const order = v3ShuffleParts(plan);
  const seen = new Set(), left = [];
  order.forEach(n=>{ if(!seen.has(n) && !done.has(n)){ seen.add(n); left.push(n); } });
  if(!plan.ids.length){ toast('오늘은 미션이 없어요'); return; }
  if(!left.length){ v3AskRedo(); return; }
  v3StartSession(left, 'v3', {day:t});
}
function v3AskRedo(){
  document.getElementById('modalContent').innerHTML = `
    <h3>📘 오늘 미션 완료 ✓</h3>
    <div class="sub" style="margin-bottom:12px;">한 번 더 풀어볼까요? 다시 하는 건 연습이라 완료 표시와 기록은 바뀌지 않아요.</div>
    <div class="hstack">
      <button class="ghost" style="flex:1;" onclick="closeModal()">닫기</button>
      <button class="primary" style="flex:1;" onclick="closeModal();setTimeout(v3Redo,50)">다시 하기</button>
    </div>`;
  document.getElementById('modalBg').classList.add('active');
  pushOverlayState();
}
async function v3Redo(d){
  d = d || todayStr();
  const plan = await v3Plan(d);
  v3StartSession(v3ShuffleParts(plan), 'v3prac');
}
async function v3WrongOnly(){
  const prog = await v3GetProg();
  const list = Object.entries(prog.cards).filter(([no,e])=>(e.wrong||[]).length)
    .map(([no])=>Number(no)).sort((a,b)=>a-b);
  if(!list.length){ toast('아직 틀린 단어가 없어요'); return; }
  v3StartSession(list, 'v3prac');
}
async function v3Starred(){
  const keys = (await getStarredKeys()).filter(k=>k.startsWith('v3:')).map(k=>Number(k.slice(3))).sort((a,b)=>a-b);
  if(!keys.length){ toast('즐겨찾기한 단어가 없어요 — 정답 화면의 ☆를 눌러 추가하세요'); return; }
  v3StartSession(keys, 'v3prac');
}
/* 요일 누르면: 그날 전체 다시하기 / 3급만 다시하기 (연습) + 지난 날 ✗면 만회 */
async function v3OpenDay(d){
  const plan = await v3Plan(d);
  const done = new Set((await v3GetDoneMap())[d] || []);
  const t = todayStr();
  const left = d<t ? plan.ids.filter(n=>!done.has(n)) : [];
  const n3 = plan.ids.filter(n=>n>=501).length;
  const [y,m,dd] = d.split('-');
  const title = Number(m)+'/'+Number(dd);
  if(!plan.ids.length){ toast(title+'은 미션이 없어요'); return; }
  document.getElementById('modalContent').innerHTML = `
    <h3>${title} 미션${d===t?' (오늘)':''}</h3>
    <div class="sub" style="margin-bottom:12px;">다시하기는 연습이라 기록은 바뀌지 않아요.</div>
    ${left.length ? `<button class="primary" style="width:100%;margin-bottom:8px;" onclick="closeModal();setTimeout(()=>v3Makeup('${d}'),50)">못 한 ${left.length}개 만회하기</button>` : ''}
    <button class="${left.length?'ghost':'primary'}" style="width:100%;margin-bottom:8px;" onclick="closeModal();setTimeout(()=>v3RedoDay('${d}',false),50)">그날 것 ${plan.ids.length}개 다시하기</button>
    ${n3 ? `<button class="ghost" style="width:100%;margin-bottom:8px;" onclick="closeModal();setTimeout(()=>v3RedoDay('${d}',true),50)">3급 ${n3}개만 다시하기</button>` : ''}
    <button class="ghost" style="width:100%;" onclick="closeModal()">닫기</button>`;
  document.getElementById('modalBg').classList.add('active');
  pushOverlayState();
}
async function v3RedoDay(d, only3){
  const plan = await v3Plan(d);
  let ids = v3ShuffleParts(plan).filter((n,i,a)=>a.indexOf(n)===i);
  if(only3) ids = ids.filter(n=>n>=501);
  v3StartSession(ids, 'v3prac');
}
async function v3Makeup(d){
  const plan = await v3Plan(d);
  const done = new Set((await v3GetDoneMap())[d] || []);
  const left = v3ShuffleParts(plan).filter((n,i,a)=>a.indexOf(n)===i && !done.has(n));
  v3StartSession(left, 'v3make', {makeDate:d});
}
/* 목록 */
async function v3OpenList(){
  const prog = await v3GetProg();
  const star = new Set((await getStarredKeys()).filter(k=>k.startsWith('v3:')));
  const groups = [];
  for(let a=1;a<=1000;a+=50) groups.push([a, a+49]);
  const lv = a=> a<=300 ? '1급' : (a<=500 ? '2급' : '3급');
  document.getElementById('modalContent').innerHTML = `
    <h3>📘 HSK 3.0 어휘 목록</h3>
    <div class="sub" style="margin-bottom:8px;">1~300 1급 · 301~500 2급 · 501~1000 3급 (학원) — 묶음을 눌러 펼치세요</div>
    <div style="max-height:62vh;overflow:auto;">
    ${groups.map(([a,b])=>`<details style="border-bottom:1px solid var(--line);padding:6px 0;"><summary style="cursor:pointer;font-weight:700;font-size:14px;">${lv(a)} ${a}~${b}</summary>
      ${v3Range(a,b).map(n=>{ const c=v3Card(n), e=prog.cards[n]||{}; const st=(e.wrong||[]).length?'<span style="color:var(--seal);font-size:11px;"> ✗'+e.wrong.length+'</span>':''; return `<div style="padding:5px 0;font-size:13px;line-height:1.5;"><span class="sub">${n}.</span> <b class="hanzi" style="font-size:16px;">${esc(c.han)}</b> <span style="color:var(--jade);">${esc(c.py)}</span>${star.has(c._key)?' <span style="color:var(--gold)">★</span>':''}${st}<div class="sub" style="font-size:12px;">${esc(c.ko).replace(/\[([^\]]+)\]/g,(m,p)=>'['+(V3_POS_NAME[v3PosKey(p)]||p)+']')}</div></div>`; }).join('')}
    </details>`).join('')}
    </div>
    <button class="ghost" style="width:100%;margin-top:10px;" onclick="closeModal()">닫기</button>`;
  document.getElementById('modalBg').classList.add('active');
  pushOverlayState();
}
function v3MeaningHTML(ko){
  // "[형]조용하다 [동]..." → 품사마다 한 줄
  return esc(ko).replace(/\s*\[([^\]]+)\]\s*/g, (m,p,off)=>(off>0?'<br>':'')+`<span class="sub" style="font-size:12px;">[${V3_POS_NAME[v3PosKey(p)]||p}]</span> `);
}
/* 홈 카드 */
async function v3HomeHTML(){
  const t = todayStr();
  const prog = await v3GetProg();
  const dm = await v3GetDoneMap();
  const plan = await v3Plan(t, prog);
  const done = new Set(dm[t] || []);
  const leftOf = arr=>arr.filter(n=>!done.has(n)).length;
  const k = v3DayIdx(t);
  const learned = Object.values(prog.cards).filter(e=>(e.days||[]).length).length;
  const pct = Math.round(learned/10);
  const left = leftOf(plan.ids);
  // 요일 줄: 오늘 앞 3일 ~ 뒤 3일 (시작일 이전은 표시 안 함)
  const W = ['일','월','화','수','목','금','토'];
  let from = addDays(t,-3); if(from < V3_START) from = V3_START;
  const cells = [];
  for(let i=0;i<7;i++){
    const d = addDays(from,i), dl = new Date(d+'T00:00:00');
    let mark='', bg='var(--paper-2)', col='var(--ink-soft)', bd='1px solid var(--line)', click='';
    if(d===t){ const ok = plan.ids.length>0 && left===0; mark = ok?'✓':'●'; if(ok){ bg='var(--jade)'; col='#fff'; } else { bd='2px solid var(--seal)'; col='var(--seal)'; } click=`v3OpenDay('${d}')`; }
    else if(d<t){
      const pl = await v3Plan(d, prog); const dd = new Set(dm[d]||[]);
      if(!pl.ids.length){ mark='–'; }
      else if(pl.ids.every(n=>dd.has(n))){ mark='✓'; bg='var(--jade)'; col='#fff'; click=`v3OpenDay('${d}')`; }
      else { mark='✗'; bg='#FCE9E9'; col='var(--seal)'; click=`v3OpenDay('${d}')`; }
    } else { bd='1px dashed var(--line)'; click=`v3OpenDay('${d}')`; }
    cells.push(`<div style="display:flex;flex-direction:column;align-items:center;gap:3px;${click?'cursor:pointer;':''}" ${click?`onclick="${click}"`:''}>
      <span style="font-size:10.5px;color:${d===t?'var(--seal)':'var(--ink-soft)'};font-weight:${d===t?700:400};">${W[dl.getDay()]}<br>${dl.getMonth()+1}/${dl.getDate()}</span>
      <div style="width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;background:${bg};color:${col};border:${bd};">${mark}</div></div>`);
  }
  const rs = v3RoundSlice(k);
  const s3 = plan.s3;
  const md = x=>Number(x.slice(5,7))+'/'+Number(x.slice(8));
  const dayLabel = s3 ? ('3급 '+(s3.kind==='new' ? `새 단어 ${s3.from}~${s3.from+49}` : s3.kind==='pre' ? `내일(${md(s3.test)}) 시험 ${s3.from}~${s3.from+49} 다시 보기` : '섞어서 복습')
                        + ' · 1·2급 ' + (plan.new12.length ? `새 단어 ${plan.new12[0]}~${plan.new12[plan.new12.length-1]}` : '복습'))
                 : rs ? `전체 복습 Day ${rs.day} / ${rs.days} · 1~1000번 섞어서 ${rs.ids.length}개`
                 : k===V3_EVE_IDX ? '시험 전날 · 그동안 틀린 것 + 즐겨찾기 전부'
                 : (k>V3_EVE_IDX ? '시험 끝! 수고했어요' : '');
  const wrongN = Object.values(prog.cards).filter(e=>(e.wrong||[]).length).length;
  const stat = (n,l,c)=>`<div style="flex:1;text-align:center;font-size:12px;"><b style="display:block;font-size:19px;color:${c||'var(--seal)'};">${n}</b>${l}</div>`;
  return `<div class="card" style="border:2px solid var(--seal);">
    <div class="row-between" style="align-items:center;"><div><h3 style="margin:0;">📘 HSK 3급 어휘 <span style="background:var(--seal);color:#fff;font-size:11px;padding:2px 8px;border-radius:10px;vertical-align:middle;">학원</span></h3>
    <div class="sub" style="margin-top:3px;">${dayLabel}</div></div></div>
    <div style="height:8px;background:var(--paper-2);border-radius:6px;overflow:hidden;margin-top:10px;"><i style="display:block;height:100%;width:${Math.min(100,pct)}%;background:var(--jade);"></i></div>
    <div class="sub" style="text-align:right;margin-top:3px;font-size:12px;">외운 단어 ${learned} / 1000</div>
    ${plan.ids.length && left===0 ? `<div style="background:#E8F3EC;color:var(--jade);font-weight:700;text-align:center;padding:9px;border-radius:8px;margin-top:8px;">🎉 오늘 미션 완료!</div>` : `
    <div style="display:flex;margin:10px 0 2px;">
      ${[[plan.new3,'3급 새 단어','var(--seal)'],[plan.pre,'내일 시험','var(--gold)'],[plan.mix3,'3급 복습','var(--seal)'],[plan.new12,'1·2급','var(--ink)'],[plan.rev12,'1·2급 복습','var(--ink)'],[plan.rev,'전체 복습','var(--seal)'],[plan.eve,'틀린 것+★','var(--seal)']]
          .filter(x=>x[0]&&x[0].length).map(x=>stat(leftOf(x[0].filter(n=>!plan.retry.includes(n))),x[1],x[2])).join('') + stat(leftOf(plan.retry),'틀린 것','var(--ink)')}
    </div>`}
    <div style="display:flex;justify-content:space-between;margin-top:10px;">${cells.join('')}</div>
    <div class="hstack" style="margin-top:12px;gap:6px;">
      <button class="ghost small" style="flex:1;padding:8px 2px;" onclick="v3OpenList()">목록</button>
      <button class="ghost small" style="flex:1;padding:8px 2px;" onclick="v3Redo()">다시하기</button>
      <button class="ghost small" style="flex:1;padding:8px 2px;" onclick="v3WrongOnly()">틀린 것 ${wrongN}</button>
      <button class="ghost small" style="flex:1;padding:8px 2px;" onclick="v3Starred()">즐겨찾기</button>
    </div>
    <button class="primary" style="width:100%;margin-top:8px;" onclick="v3StartMission()">일일 미션 ${left>0?left+'개':'완료 ✓'}</button>
  </div>`;
}
function v3ToggleFold(){
  const box = document.getElementById('tutorFold'), arrow = document.getElementById('tutorFoldArrow');
  if(!box) return;
  const open = box.style.display==='none';
  box.style.display = open ? '' : 'none';
  if(arrow) arrow.textContent = open ? '▾' : '▸';
  try{ localStorage.setItem('home-tutor-open', open?'1':'0'); }catch(e){}
}
function v3FoldOpen(){ try{ return localStorage.getItem('home-tutor-open')==='1'; }catch(e){ return false; } }
