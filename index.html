<style>
  :root{
    --paper:#FBF7EE;
    --paper-2:#F3ECDD;
    --ink:#20242A;
    --ink-soft:#5A5F66;
    --seal:#B33B3B;
    --seal-dark:#8F2E2E;
    --jade:#3E7C59;
    --gold:#C08A2E;
    --line:#E4DCC8;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR', -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .hanzi{font-family:'Noto Serif SC', serif;}
  #app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--paper);position:relative;padding-bottom:84px;}

  header.top{
    padding:22px 20px 16px;
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px;
  }
  .seal-mark{
    width:44px;height:44px;border-radius:50%;background:var(--paper-2);
    font-size:26px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    border:1.5px solid var(--line);
  }
  header.top h1{font-size:19px;margin:0;line-height:1.2;}
  header.top p{margin:2px 0 0;font-size:12px;color:var(--ink-soft);}

  nav.tabs{
    position:fixed;bottom:0;left:0;right:0;
    max-width:520px;margin:0 auto;
    background:#fff;border-top:1px solid var(--line);
    display:flex;z-index:20;
  }
  nav.tabs button{
    flex:1;border:none;background:none;padding:12px 4px 10px;
    font-family:inherit;font-size:11px;color:var(--ink-soft);cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;
  }
  nav.tabs button .ic{font-size:18px;}
  nav.tabs button.active{color:var(--seal);font-weight:700;}

  section.view{display:none;padding:18px 20px 20px;}
  section.view.active{display:block;}

  .card{
    background:#fff;border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;margin-bottom:14px;
  }
  .card h3{margin:0 0 4px;font-size:15px;}
  .sub{font-size:12.5px;color:var(--ink-soft);}
  .card .sub{margin-bottom:10px;}
  .row-between{display:flex;justify-content:space-between;align-items:center;}
  .badge{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:26px;height:20px;padding:0 6px;border-radius:6px;
    background:var(--paper-2);color:var(--gold);font-size:12px;font-weight:700;
  }
  .badge.due{background:#FCE9E9;color:var(--seal);}

  button.primary{
    background:var(--seal);color:#fff;border:none;border-radius:10px;
    padding:11px 16px;font-family:inherit;font-size:14px;font-weight:700;
    cursor:pointer;box-shadow:0 2px 0 var(--seal-dark);
  }
  button.primary:disabled{opacity:.4;box-shadow:none;}
  button.ghost{
    background:none;border:1px solid var(--line);border-radius:10px;
    padding:10px 14px;font-family:inherit;font-size:13px;color:var(--ink);cursor:pointer;
  }
  button.small{padding:6px 10px;font-size:12px;border-radius:8px;}
  .stack{display:flex;flex-direction:column;gap:8px;}
  .hstack{display:flex;gap:8px;}

  h2.section-title{font-size:14px;color:var(--ink-soft);margin:22px 0 10px;letter-spacing:.02em;}
  h2.section-title:first-child{margin-top:0;}

  select, input[type=text], input[type=number], textarea{
    font-family:inherit;font-size:14px;border:1px solid var(--line);
    border-radius:8px;padding:9px 10px;width:100%;background:#fff;color:var(--ink);
  }
  textarea{resize:vertical;min-height:120px;font-family:ui-monospace,monospace;font-size:13px;}
  label.field-label{font-size:12px;color:var(--ink-soft);display:block;margin-bottom:4px;}

  table.list{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.list th{text-align:left;font-size:11px;color:var(--ink-soft);font-weight:600;padding:6px 6px;border-bottom:1px solid var(--line);}
  table.list td{padding:8px 6px;border-bottom:1px solid #F0EBDD;}
  table.list td.han{font-family:'Noto Serif SC',serif;font-size:17px;}

  .empty{
    text-align:center;padding:36px 16px;color:var(--ink-soft);font-size:13.5px;
    border:1px dashed var(--line);border-radius:var(--radius);
  }

  /* review overlay */
  #reviewOverlay{
    position:fixed;inset:0;background:var(--paper);z-index:50;
    display:none;flex-direction:column;
  }
  #reviewOverlay.active{display:flex;}
  .review-head{
    padding:16px 18px 10px;display:flex;justify-content:space-between;align-items:center;
    border-bottom:1px solid var(--line);
  }
  .review-progress{font-size:12px;color:var(--ink-soft);}
  .review-card-no{font-size:13px;font-weight:700;color:var(--seal);}
  .review-body{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;align-items:center;gap:18px;}
  .big-hanzi{font-family:'Noto Serif SC',serif;font-size:64px;font-weight:700;text-align:center;line-height:1.2;}
  .writing-row{display:flex;gap:12px;justify-content:center;flex-wrap:nowrap;}
  .writing-box{display:flex;flex-direction:column;align-items:center;gap:6px;flex:0 0 auto;}
  canvas.wcanvas{
    background:#fff;border:1px solid var(--line);border-radius:10px;touch-action:none;box-sizing:border-box;display:block;
  }
  .answer-panel{
    width:100%;max-width:360px;background:#fff;border:1px solid var(--line);
    border-radius:var(--radius);padding:16px;text-align:center;
  }
  .answer-panel .py{font-size:20px;color:var(--jade);font-weight:700;margin-bottom:4px;}
  .answer-panel .mean{font-size:14px;color:var(--ink);}
  .answer-panel .han-big{font-family:'Noto Serif SC',serif;font-size:30px;margin-bottom:6px;}
  .rate-row{display:flex;gap:8px;width:100%;max-width:360px;}
  .rate-row button{flex:1;padding:12px 4px;border-radius:10px;border:none;font-family:inherit;font-weight:700;font-size:13px;color:#fff;cursor:pointer;}
  .rate-again{background:#A24848;}
  .rate-good{background:var(--jade);}
  .rate-easy{background:var(--gold);}
  .star-btn{
    flex:0 0 auto;width:48px;border:1.5px solid var(--gold);background:#fff;
    border-radius:10px;font-size:22px;color:var(--gold);cursor:pointer;margin-left:8px;
  }
  .star-btn-sm{
    border:none;background:none;font-size:18px;color:var(--gold);cursor:pointer;padding:2px 4px;
  }
  .review-foot{padding:14px 20px 20px;}

  .pinyin-wrap{width:100%;max-width:360px;}
  .pinyin-input{
    text-align:center;font-size:17px;font-weight:600;color:var(--jade);
    border:1.5px solid var(--line);margin-bottom:8px;
  }
  .pinyin-input:disabled{background:#F6F3EA;color:var(--ink-soft);}
  .tone-toolbar{display:flex;flex-direction:column;gap:6px;align-items:center;}
  .tone-row{display:flex;gap:14px;}
  .tone-group{display:flex;gap:5px;}
  .tone-btn{
    width:32px;height:32px;padding:0;
    border:1px solid var(--line);background:#fff;border-radius:6px;
    font-size:14px;font-family:inherit;color:var(--ink);cursor:pointer;
  }
  .tone-btn:active{background:var(--paper-2);}

  .modal-bg{
    position:fixed;inset:0;background:rgba(32,36,42,.5);z-index:60;
    display:none;align-items:flex-end;justify-content:center;

  .modal-bg.active{display:flex;}

  .modal .hint{font-size:12px;color:var(--ink-soft);line-height:1.6;background:var(--paper-2);padding:10px 12px;border-radius:8px;margin:10px 0;white-space:pre-line;}
  .toast{
    position:fixed;bottom:96px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;
    z-index:80;opacity:0;transition:opacity .25s;pointer-events:none;
  }
  .toast.show{opacity:1;}
</style>
</head>

<script>
/* ---------------- storage helpers (브라우저 localStorage 사용 — 로그인 불필요) ---------------- */
async function sGet(key){
  try{ const raw = localStorage.getItem(key); return raw===null ? null : JSON.parse(raw); }
  catch(e){ return null; }
}
async function sSet(key,val){
  try{ localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch(e){ console.error('storage set failed', e); return false; }
}

/* ---------------- date helpers ---------------- */
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function addDays(base, n){
  const d = new Date(base+'T00:00:00');
  d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function uid(prefix){
  return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._h);
  toast._h=setTimeout(()=>t.classList.remove('show'),1800);
}

function parseHSKSeed(raw, level){
  return raw.trim().split('\n').map(line=>{
    const [no,han,py,en,ko] = line.split('\t');
    return {id:uid('hsk'), no:Number(no), han, py, en, ko, level};
  });
}

/* ---------------- 학습 완료(cleared) 상태 관리 ----------------
   기존 간격 반복(날짜 기반 due) 대신, "정답으로 표시하면 이후 복습에서 제외되고
   초기화하면 전체가 다시 대상이 되는" 단순한 방식으로 동작합니다. */
async function getCleared(){ return (await sGet('cleared')) || []; }
async function setCleared(arr){ await sSet('cleared', arr); }
async function getClearedStarred(){ return (await sGet('cleared-starred')) || []; }
async function setClearedStarred(arr){ await sSet('cleared-starred', arr); }

function computeQueue(deckName, cards, idFilter, clearedSet){
  let pool = cards;
  if(deckName==='hsk' && idFilter){
    const allowed = new Set(idFilter);
    pool = cards.filter(c=>allowed.has(c.id));
  }
  return pool
    .filter(c=> !clearedSet.has(deckName+':'+c.id))
    .map(c=>({...c, _key:deckName+':'+c.id}));
}

function resolveHskScope(cards, rawScope){
  const allIds = cards.map(c=>c.id);
  if(!rawScope || !Array.isArray(rawScope)) return allIds;
  const filtered = rawScope.filter(id=>allIds.includes(id));
  return filtered.length ? filtered : allIds;
}
async function getSavedHskScope(cards){
  const saved = await sGet('hsk-review-scope');
  return resolveHskScope(cards, saved);
}

/* ---------------- data access ---------------- */
async function loadDeck(key){ return (await sGet(key)) || []; }
async function saveDeck(key, arr){ await sSet(key, arr); }

async function ensureSeed(){
  let hsk = await loadDeck('hsk-words');
  if(hsk.length===0){
    hsk = parseHSKSeed(HSK1_RAW, '1');
    await saveDeck('hsk-words', hsk);
  }
  if(!hsk.some(c=>String(c.level)==='2')){
    const hsk2 = parseHSKSeed(HSK2_RAW, '2');
    hsk = hsk.concat(hsk2);
    await saveDeck('hsk-words', hsk);
  }
  const vocab = await loadDeck('textbook-vocab');
  if(vocab.length===0){
    const seeded = TEXTBOOK_VOCAB_RAW.trim().split('\n').map(line=>{
      const [py,ko] = line.split('\t');
      return {id:uid('vocab'), py, ko};
    });
    await saveDeck('textbook-vocab', seeded);
  }
}

/* ---------------- tab switching ---------------- */
const TAB_RENDER = { home: renderHome, hsk: renderHskTab, vocab: renderVocabTab, expr: renderExprTab };

function switchTab(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
  TAB_RENDER[name]();
}
document.querySelectorAll('.tab-btn').forEach(b=>{
  b.addEventListener('click', ()=>switchTab(b.dataset.tab));
});

/* ---------------- HOME ---------------- */
async function renderHome(){
  const el = document.getElementById('view-home');
  el.innerHTML = '<div class="empty">불러오는 중…</div>';
  const [hsk, vocab, expr, rawScope, cleared, starredArr] = await Promise.all([
    loadDeck('hsk-words'), loadDeck('textbook-vocab'), loadDeck('textbook-expr'),
    sGet('hsk-review-scope'), getCleared(), getStarredKeys()
  ]);
  const clearedSet = new Set(cleared);
  function remainCount(deckName, cards){
    return cards.filter(c=>!clearedSet.has(deckName+':'+c.id)).length;
  }
  const hskRemain = remainCount('hsk', hsk);
  const vocabRemain = remainCount('vocab', vocab);
  const exprRemain = remainCount('expr', expr);
  function starCount(deckName){ return starredArr.filter(k=>k.startsWith(deckName+':')).length; }
  function deckCard(title, sub, total, remain, tab, startAction){
    return `<div class="card">
      <div class="row-between">
        <div><h3>${title}</h3><div class="sub">${sub}</div></div>
        <div style="text-align:right;font-size:12.5px;color:var(--ink-soft);white-space:nowrap;">
          <b style="color:${remain>0?'var(--seal)':'var(--jade)'};font-size:14px;">${remain}개</b> · 총 ${total}개
        </div>
      </div>
      <div class="hstack" style="flex-wrap:wrap;row-gap:8px;">
        <button class="primary small" ${remain===0?'disabled':''} onclick="${startAction}">복습 시작</button>
        <button class="ghost small" onclick="openResetProgressConfirm('${tab}')">복습 초기화</button>
        <button class="ghost small" onclick="reviewStarred('${tab}')">⭐ 즐겨찾기 복습 (${starCount(tab)})</button>
        <button class="ghost small" onclick="openResetStarredConfirm('${tab}')">즐겨찾기 초기화</button>
      </div>
    </div>`;
  }
  el.innerHTML = `
    <h2 class="section-title">오늘의 복습</h2>
    ${deckCard('HSK 단어장','한자 쓰기 · 뜻 · 병음', hsk.length, hskRemain, 'hsk', `switchTab('hsk');setTimeout(()=>openReviewScope(),0)`)}
    ${deckCard('교재 단어','뜻 · 병음', vocab.length, vocabRemain, 'vocab', `switchTab('vocab');setTimeout(()=>startReview('vocab'),0)`)}
    ${deckCard('교재 표현','뜻 보고 병음 쓰기', expr.length, exprRemain, 'expr', `switchTab('expr');setTimeout(()=>startReview('expr'),0)`)}
  `;
}

let hskLevelFilter = 'all';
async function renderHskTab(){
  const el = document.getElementById('view-hsk');
  const [cards, starredArr, clearedStarredArr] = await Promise.all([loadDeck('hsk-words'), getStarredKeys(), getClearedStarred()]);
  const levels = [...new Set(cards.map(c=>String(c.level)))].sort();
  const starredCount = starredArr.filter(k=>k.startsWith('hsk:')).length;
  const clearedStarredSet = new Set(clearedStarredArr);
  const starredRemain = starredArr.filter(k=>k.startsWith('hsk:') && !clearedStarredSet.has(k)).length;
  window._hskCards = cards;
  window._hskStarred = new Set(starredArr);
  el.innerHTML = `
    <div class="row-between" style="margin-bottom:12px;">
      <select id="hskLevelSel" style="width:auto;">
        <option value="all">전체 급수</option>
        ${levels.map(l=>`<option value="${l}" ${hskLevelFilter===l?'selected':''}>${l}급</option>`).join('')}
      </select>
      <button class="ghost small" onclick="openImport('hsk')">+ 단어 추가</button>
    </div>
    <div class="card">
      <h3>⭐ 즐겨찾기</h3>
      <div class="sub">${starredRemain}개 남음 · 총 ${starredCount}개</div>
      <div class="hstack" style="flex-wrap:wrap;row-gap:8px;">
        <button class="primary small" onclick="reviewStarred('hsk')">즐겨찾기 복습</button>
        <button class="ghost small" onclick="openStarredList('hsk')">즐겨찾기 목록</button>
        <button class="ghost small" onclick="openResetStarredConfirm('hsk')">즐겨찾기 초기화</button>
      </div>
    </div>
    <h2 class="section-title">전체 목록 (${cards.length})</h2>
    <input type="text" id="hskSearch" placeholder="한자/병음/뜻 검색" style="margin-bottom:10px;">
    <div id="hskListWrap"></div>
  `;
  document.getElementById('hskLevelSel').addEventListener('change', e=>{ hskLevelFilter=e.target.value; renderHskTab(); });
  document.getElementById('hskSearch').addEventListener('input', e=>renderHskList(cards, e.target.value));
  renderHskList(cards, '');
}
function renderHskList(cards, q){
  const wrap = document.getElementById('hskListWrap');
  let filtered = hskLevelFilter==='all' ? cards : cards.filter(c=>String(c.level)===hskLevelFilter);
  if(q) filtered = filtered.filter(c=> (c.han+c.py+c.ko+c.en).toLowerCase().includes(q.toLowerCase()));
  if(filtered.length===0){ wrap.innerHTML='<div class="empty">해당하는 단어가 없어요.</div>'; return; }
  wrap.innerHTML = `<table class="list"><thead><tr><th>#</th><th>한자</th><th>병음</th><th>뜻</th><th>급</th><th>★</th></tr></thead><tbody>
    ${filtered.map(c=>{
      const starred = window._hskStarred && window._hskStarred.has('hsk:'+c.id);
      return `<tr><td style="color:var(--ink-soft);font-size:12px;">${esc(c.no)}</td><td class="han">${esc(c.han)}</td><td>${esc(c.py)}</td><td>${esc(c.ko)}</td><td>${esc(c.level)}급</td><td><button class="star-btn-sm" onclick="toggleListStar('${c.id}')">${starred?'★':'☆'}</button></td></tr>`;
    }).join('')}
  </tbody></table>`;
}
async function toggleListStar(id){
  const key = 'hsk:'+id;
  const arr = await getStarredKeys();
  const set = new Set(arr);
  if(set.has(key)) set.delete(key); else set.add(key);
  await setStarredKeys(Array.from(set));
  window._hskStarred = set;
  const q = document.getElementById('hskSearch') ? document.getElementById('hskSearch').value : '';
  renderHskList(window._hskCards, q);
}

    ${filtered.map(c=>`<tr><td>${esc(c.py)}</td><td>${esc(c.ko)}</td></tr>`).join('')}
  </tbody></table>`;
}

  const [cards, starredArr] = await Promise.all([loadDeck(deckKey), getStarredKeys()]);
  window._starredListDeck = deckName;
  window._starredListCards = cards;
  window._starredListSet = new Set(starredArr);
  const modal = document.getElementById('modalContent');

async function submitImport(deck){
  const text = document.getElementById('importText').value.trim();
  if(!text){ toast('내용을 입력해주세요'); return; }
  const level = deck==='hsk' ? (document.getElementById('importLevel').value || '2') : null;
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  const deckKey = deck==='hsk' ? 'hsk-words' : (deck==='vocab' ? 'textbook-vocab' : 'textbook-expr');
  const existing = await loadDeck(deckKey);
  let added = 0;
  lines.forEach(line=>{
    const parts = line.split('\t').length>1 ? line.split('\t') : line.split(/\s{2,}/);
    if(deck==='hsk'){
      if(parts.length<3) return;
      const [han,py,en,ko] = [parts[0], parts[1], parts[2]||'', parts[3]||parts[2]||''];
      existing.push({id:uid('hsk'), no: existing.length+1, han:han.trim(), py:py.trim(), en:en.trim(), ko:ko.trim(), level});
    } else {
      if(parts.length<2) return;
      const [py,ko] = [parts[0], parts[1]];
      existing.push({id:uid(deck), py:py.trim(), ko:ko.trim()});
    }
    added++;
  });
  if(added===0){ toast('인식된 줄이 없어요. 형식을 확인해주세요'); return; }
  await saveDeck(deckKey, existing);
  closeModal();
  toast(added+'개 추가되었어요');
  if(deck==='hsk') renderHskTab(); else if(deck==='vocab') renderVocabTab(); else renderExprTab();
}

/* ---------------- REVIEW SESSION ---------------- */
let review = null;

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

async function getStarredKeys(){ return (await sGet('starred')) || []; }
async function setStarredKeys(arr){ await sSet('starred', arr); }

async function startReview(deckName, ids){
  const deckKey = deckName==='hsk' ? 'hsk-words' : (deckName==='vocab' ? 'textbook-vocab' : 'textbook-expr');
  const cards = await loadDeck(deckKey);
  let idFilter = null;
  if(deckName==='hsk'){
    idFilter = ids || await getSavedHskScope(cards);
  }
  const cleared = new Set(await getCleared());
  let queue = computeQueue(deckName, cards, idFilter, cleared);
  if(queue.length===0){ toast('학습 완료! "복습 초기화"를 누르면 처음부터 다시 볼 수 있어요'); return; }
  queue = shuffle(queue);
  const starred = new Set(await getStarredKeys());
  review = {deck:deckName, queue, index:0, stage:'question', starred, mode:'general'};
  document.getElementById('reviewOverlay').classList.add('active');
  renderReviewStep();
}
async function reviewStarred(deckName){
  const deckKey = deckName==='hsk' ? 'hsk-words' : (deckName==='vocab' ? 'textbook-vocab' : 'textbook-expr');
  const cards = await loadDeck(deckKey);
  const starred = new Set(await getStarredKeys());
  const clearedStarred = new Set(await getClearedStarred());
  const starredCards = cards.filter(c=>starred.has(deckName+':'+c.id));
  if(starredCards.length===0){ toast('⭐ 표시한 단어가 아직 없어요'); return; }
  let queue = computeQueue(deckName, starredCards, null, clearedStarred);
  if(queue.length===0){ toast('즐겨찾기 학습 완료! "즐겨찾기 초기화"를 누르면 다시 볼 수 있어요'); return; }
  queue = shuffle(queue);
  review = {deck:deckName, queue, index:0, stage:'question', starred, mode:'starred'};
  document.getElementById('reviewOverlay').classList.add('active');
  renderReviewStep();
}
function closeReview(){
  document.getElementById('reviewOverlay').classList.remove('active');
  review = null;
  TAB_RENDER[document.querySelector('.tab-btn.active').dataset.tab]();
}

function renderReviewStep(){
  if(!review) return;
  if(review.index >= review.queue.length){
    document.getElementById('reviewProgress').textContent='';
    document.getElementById('reviewCardNo').textContent='';
    document.getElementById('reviewBody').innerHTML = `<div class="empty" style="border:none;">
      <div style="font-size:36px;margin-bottom:8px;">🎉</div>
      <div style="font-size:15px;color:var(--ink);font-weight:700;">오늘 복습 완료!</div>
    </div>`;
    document.getElementById('reviewFoot').innerHTML = `<button class="primary" style="width:100%;" onclick="closeReview()">닫기</button>`;
    return;
  }
  document.getElementById('reviewProgress').textContent = (review.index+1)+' / '+review.queue.length;
  const card = review.queue[review.index];
  document.getElementById('reviewCardNo').textContent = (review.deck==='hsk' && card.no!=null) ? ('No.'+card.no) : '';

function setupCanvas(canvas, ch){
  const ctx = canvas.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  canvas.dataset.char = ch;
  canvas._strokes = [];
  let drawing=false, lastX=0, lastY=0, currentStroke=null;
  function pos(e){
    const r = canvas.getBoundingClientRect();
    const cx = (e.touches? e.touches[0].clientX : e.clientX) - r.left;
    const cy = (e.touches? e.touches[0].clientY : e.clientY) - r.top;
    return [cx,cy];
  }
  function start(e){
    drawing=true; [lastX,lastY]=pos(e);
    currentStroke = [{x:lastX,y:lastY}];
    e.preventDefault();
  }
  function move(e){
    if(!drawing) return;
    const [x,y]=pos(e);
    ctx.strokeStyle='#20242A'; ctx.lineWidth=7; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(x,y); ctx.stroke();
    if(currentStroke) currentStroke.push({x,y});
    [lastX,lastY]=[x,y]; e.preventDefault();
  }
  function end(){
    if(drawing && currentStroke && currentStroke.length>1){
      canvas._strokes.push(currentStroke);
      window._strokeLog = window._strokeLog || [];
      window._strokeLog.push(canvas);
    }
    drawing=false; currentStroke=null;
  }
  canvas.addEventListener('pointerdown', start);
  canvas.addEventListener('pointermove', move);
  window.addEventListener('pointerup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
}
function redrawCanvasStrokes(canvas){
  const ctx = canvas.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle='#20242A'; ctx.lineWidth=7; ctx.lineCap='round'; ctx.lineJoin='round';
  (canvas._strokes||[]).forEach(stroke=>{
    ctx.beginPath();
    stroke.forEach((pt,i)=>{ if(i===0) ctx.moveTo(pt.x,pt.y); else ctx.lineTo(pt.x,pt.y); });
    ctx.stroke();
  });
}
function undoStroke(){
  if(!window._strokeLog || window._strokeLog.length===0) return;
  const canvas = window._strokeLog.pop();
  if(canvas._strokes && canvas._strokes.length){
    canvas._strokes.pop();
    redrawCanvasStrokes(canvas);
  }
}
function clearAllCanvases(){
  (window._canvases||[]).forEach(canvas=>{
    canvas._strokes = [];
    const ctx = canvas.getContext('2d');
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  });
  window._strokeLog = [];
}

/* --- 정답 화면 --- */
function revealCard(){
  const el = document.getElementById('pinyinInput');
  review.typedPinyin = el ? el.value.trim() : '';
  if(el) el.disabled = true;
  review.stage = 'revealed';
  renderRevealed(review.queue[review.index]);
}
function skipToReveal(){
  review.typedPinyin = '';
  review.skipped = true;
  revealCard();
}
function typedCompareHTML(card){
  if(!review.typedPinyin) return '';
  return `<div class="sub" style="margin-top:8px;">내가 쓴 병음: <b style="color:var(--ink);">${esc(review.typedPinyin)}</b></div>`;
}
function drawAnswerOverlay(canvas){
  const ctx = canvas.getContext('2d');
  ctx.globalAlpha=0.28;
  ctx.fillStyle='#B33B3B';
  ctx.font = Math.round(canvas.width*0.75)+'px "Noto Serif SC", serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(canvas.dataset.char, canvas.width/2, canvas.height/2+4);
  ctx.globalAlpha=1;
}
function clearInkKeepOverlay(){
  (window._canvases||[]).forEach(canvas=>{
    canvas._strokes = [];
    const ctx = canvas.getContext('2d');
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
    drawAnswerOverlay(canvas);
  });
  window._strokeLog = [];
}
function renderRevealed(card){
  const deck = review.deck;
  if(deck==='hsk'){
    (window._canvases||[]).forEach(canvas=>drawAnswerOverlay(canvas));
    document.getElementById('answerSlot').innerHTML = `
      <div class="answer-panel">
        <div class="han-big hanzi">${esc(card.han)}</div>
        <div class="py">${esc(card.py)}</div>
      </div>
      ${typedCompareHTML(card)}
    `;
  } else {
    document.getElementById('answerSlot').innerHTML = `
      <div class="answer-panel">
        <div class="py" style="font-size:24px;">${esc(card.py)}</div>
      </div>
      ${typedCompareHTML(card)}
    `;
  }
  if(review.skipped){
    document.getElementById('reviewFoot').innerHTML = `
      <div class="sub" style="text-align:center;margin-bottom:6px;color:var(--seal);">오답으로 기록돼요 — 곧 다시 나와요</div>
      <button class="primary" style="width:100%;" onclick="rateCard('again')">다음</button>
    `;
  } else {
    const isStarred = review.starred && review.starred.has(card._key);
    document.getElementById('reviewFoot').innerHTML = `
      ${deck==='hsk' ? '<button class="ghost small" style="width:100%;margin-bottom:8px;" onclick="clearInkKeepOverlay()">지우기 (다시 써보기)</button>' : ''}
      <div class="sub" style="text-align:center;margin-bottom:6px;">직접 쓴 것과 비교해서 맞았는지 표시해주세요</div>
      <div class="hstack" style="align-items:stretch;">
        <div class="rate-row" style="flex:1;">
          <button class="rate-good" onclick="rateCard('good')">정답</button>
          <button class="rate-again" onclick="rateCard('again')">오답</button>
        </div>
        <button class="star-btn" id="starBtn" onclick="toggleStar()">${isStarred?'★':'☆'}</button>
      </div>
    `;
  }
}
function toggleStar(){
  const card = review.queue[review.index];
  if(!review.starred) review.starred = new Set();
  if(review.starred.has(card._key)) review.starred.delete(card._key);
  else review.starred.add(card._key);
  setStarredKeys(Array.from(review.starred));
  const btn = document.getElementById('starBtn');
  if(btn) btn.textContent = review.starred.has(card._key) ? '★' : '☆';
}
async function rateCard(rating){
  const card = review.queue[review.index];
  if(rating==='good'){
    if(review.mode==='starred'){
      const cleared = await getClearedStarred();
      if(!cleared.includes(card._key)) cleared.push(card._key);
      await setClearedStarred(cleared);
    } else {
      const cleared = await getCleared();
      if(!cleared.includes(card._key)) cleared.push(card._key);
      await setCleared(cleared);
    }
  } else {
    review.queue.push(card);
  }
  review.index++;
  review.stage = 'question';
  review.skipped = false;
  renderReviewStep();
}

/* ---------------- init ---------------- */
(async function init(){
  await ensureSeed();
  renderHome();
})();
</script>
</body>
</html>
